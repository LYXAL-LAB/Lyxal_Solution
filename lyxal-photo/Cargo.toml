[package]
name = "lyxal-photo"
version = "0.1.0"
edition = "2021"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.0", features = ["v4", "serde"] }
hex = "0.4"
sha2 = "0.10"
image = "0.24"
webp = "0.2"
ravif = "0.11"
reqwest = { version = "0.11", features = ["json", "stream"] }
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"
anyhow = "1.0"
futures-util = "0.3"
log = "0.4"
fast_image_resize = "2.7"
tempfile = "3.8"
ort = "1.16"
ndarray = "0.15"
lru = "0.12"
