[workspace]
resolver = "2"
members = [
    "crates/lyxal_error",
    "crates/lyxal_surreal",
    "crates/lyxal_runtime",
    "crates/lyxal_event",
    "crates/lyxal_crypto",
    "crates/lyxal_pipeline_ingestion",
    "apps/lyxal-server",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
lyxal_error = { path = "crates/lyxal_error" }
lyxal_surreal = { path = "crates/lyxal_surreal" }
lyxal_runtime = { path = "crates/lyxal_runtime" }
lyxal_event = { path = "crates/lyxal_event" }
lyxal_crypto = { path = "crates/lyxal_crypto" }
lyxal_pipeline_ingestion = { path = "crates/lyxal_pipeline_ingestion" }
surrealdb = { version = "2.2", features = ["protocol-ws", "protocol-http", "kv-mem"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
async-trait = "0.1"
tokio = { version = "1.38", features = ["time", "sync", "macros", "rt", "rt-multi-thread", "signal"] }
tokio-util = { version = "0.7", features = ["rt"] }
semver = { version = "1.0", features = ["serde"] }
toml = "0.8"
sha2 = "0.10"
tempfile = "3.10"
uuid = { version = "1.10", features = ["v4", "v7", "serde"] }
fastrand = "2.1"
tracing = "0.1"
anyhow = "1.0"
axum = "0.7"
chrono = { version = "0.4", features = ["serde"] }
config = "0.14"
http = "1.1"
tower = { version = "0.4", features = ["limit"] }
tower-http = { version = "0.5", features = ["trace", "cors", "catch-panic", "limit", "timeout"] }
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
