[workspace]
resolver = "2"
members = [
    "lyxal_error",
    "lyxal_surreal",
    "crates/lyxal_runtime",
    "crates/lyxal_event",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
lyxal_error = { path = "lyxal_error" }
lyxal_surreal = { path = "lyxal_surreal" }
lyxal_runtime = { path = "crates/lyxal_runtime" }
lyxal_event = { path = "crates/lyxal_event" }
surrealdb = { version = "2.2", features = ["protocol-ws", "kv-mem"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
async-trait = "0.1"
tokio = { version = "1.38", features = ["time", "sync", "macros", "rt", "rt-multi-thread"] }
tokio-util = { version = "0.7", features = ["rt"] }
semver = { version = "1.0", features = ["serde"] }
toml = "0.8"
sha2 = "0.10"
tempfile = "3.10"
uuid = { version = "1.10", features = ["v4", "v7", "serde"] }
fastrand = "2.1"
tracing = "0.1"
