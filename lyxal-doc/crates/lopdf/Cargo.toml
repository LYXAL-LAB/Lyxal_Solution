[package]
name = "lopdf"
version = "0.39.0"
edition = "2021"
description = "A Rust library for PDF document manipulation (vendored)"
license = "MIT"
authors = [
    "Junfeng Liu <china.liujunfeng@gmail.com>",
    "Emulator <emulator@hotmail.it>",
]

[dependencies]
# Vendored (local) crates
itoa = { path = "../itoa" }
weezl = { path = "../weezl" }
rangemap = { path = "../rangemap" }
bitflags = { path = "../bitflags" }
indexmap = { path = "../indexmap" }
nom = { path = "../nom" }

# External crates (still needed)
aes = "0.8.4"
cbc = "0.1.2"
ecb = "0.1.2"
encoding_rs = "0.8.32"
flate2 = "1.0"
getrandom = "0.3"
log = "0.4"
md-5 = "0.10"
nom_locate = { path = "../nom_locate" }
rand = "0.9"
sha2 = "0.10.8"
stringprep = "0.1.5"
thiserror = "2.0.3"
ttf-parser = "0.25"

# Optional features disabled by default
chrono = { version = "0.4", optional = true, default-features = false, features = ["std", "clock"] }
jiff = { version = "0.1", optional = true }
time = { version = "0.3", features = ["formatting", "parsing"], optional = true }
rayon = { version = "1.6", optional = true }
image = { version = "0.24", optional = true }
serde = { version = "1.0", features = ["derive"], optional = true }
tokio = { version = "1", features = ["fs", "io-util"], optional = true }

[features]
default = []
async = ["tokio/rt-multi-thread", "tokio/macros"]
embed_image = ["image"]
