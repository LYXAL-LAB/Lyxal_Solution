[package]
name = "lyxal_raft-memstore"
description = "A in-memory implementation of the `lyxal_raft::RaftLogStorage` and `lyxal_raft::RaftStateMachine` trait."
documentation = "https://docs.rs/lyxalraft-memstore"
readme = "README.md"

version       = { workspace = true }
edition       = { workspace = true }
authors       = { workspace = true }
categories    = { workspace = true }
homepage      = { workspace = true }
keywords      = { workspace = true }
license       = { workspace = true }
repository    = { workspace = true }

[dependencies]
lyxal_raft = { path = "../../lyxal_core", version = "0.10.0", features = ["serde", "type-alias"] }

derive_more = { workspace = true }
futures     = { workspace = true }
serde       = { workspace = true }
serde_json  = { workspace = true }
tokio       = { workspace = true }
tracing     = { workspace = true }

[dev-dependencies]

[features]
bt = ["lyxal_raft/bt"]
single-term-leader = []

[package.metadata.docs.rs]
all-features = true
