[package]
name = "lyxal_image"
version = "0.1.0"
edition = "2021"

[dependencies]
# --- Core ---
# image: On désactive les features par défaut pour contrôler précisément
image = "0.24.7"
image_legacy = { package = "image", version = "0.23", default-features = false }
fast_image_resize = "2.7" # Très performant avec SIMD

# --- Vector & Text ---
resvg = "0.36"
tiny-skia = "0.11"
usvg = "0.36"
cosmic-text = "0.11" # Moteur de texte avancé
lyxal_text = { path = "../Lyxal_Text" }
lazy_static = "1.4"

# --- ML & Math ---
tract-onnx = "0.21" # Inférence IA pure Rust
tract-core = "0.21"

# --- Security ---
img_hash = "3.2"
base64 = "0.21"
sha2 = "0.10"

# --- Utils ---
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
anyhow = "1.0"