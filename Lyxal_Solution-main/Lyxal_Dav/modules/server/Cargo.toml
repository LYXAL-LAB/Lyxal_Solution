[package]
name = "lyxal-dav-server"
version = "1.0.0"
edition = "2021"

[dependencies]
lyxal-dav-core = { path = "../core" }
lyxal_ical_core = { path = "../../crates/lyxal_ical_core" }
lyxal_vcard_core = { path = "../../crates/lyxal_vcard_core" }

# Web Framework
axum = "0.7"
tokio = { workspace = true, features = ["full"] }

# Utilities
anyhow = { workspace = true }
async-trait = { workspace = true }
serde = { workspace = true }
uuid = { version = "1.0", features = ["v4"] }
blake3 = "1.5"
sqlx = { version = "0.7", features = ["sqlite", "runtime-tokio-rustls", "uuid", "chrono", "macros"] }
serde_json = { version = "1.0" }
chrono = { workspace = true }
base64 = "0.21"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tower-http = { version = "0.5", features = ["timeout", "trace"] }
clap = { version = "4.5.53", features = ["derive"] }
surrealdb = "2.1"
url = "2.5.7"
