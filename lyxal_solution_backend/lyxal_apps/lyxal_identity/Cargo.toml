[workspace]
resolver = "2"

members = [
    "lyxal_core",
    "lyxal_schema",
    "lyxal_iam",
    "lyxal_auth",
    "lyxal_session",
    "lyxal_rbac",
    "lyxal_oauth",
    "lyxal_mfa",
    "lyxal_connectors",
    "lyxal_server",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Lyxal Team"]
license = "MPL-2.0"

[workspace.dependencies]
# --- Core & Utilities ---
anyhow = "1.0"
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
config = "0.14"
dotenvy = "0.15"
rand = "0.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
tracing = "0.1"
uuid = { version = "1.0", features = ["v4", "serde"] }

# --- Web & Async ---
axum = "0.7"
tokio = { version = "1.0", features = ["full"] }
tower-sessions = "0.12"
tower-sessions-sqlx-store = { version = "0.12", default-features = false, features = ["postgres"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

# --- Database ---
sqlx = { version = "0.7", default-features = false, features = ["runtime-tokio-rustls", "postgres", "uuid", "chrono", "macros", "json"] }
lyxal = { version = "2.0", features = ["kv-mem"] }

# --- Security ---
argon2 = "0.5"
jsonwebtoken = "9.0"
openssl = { version = "0.10", features = ["vendored"] }

# --- API Documentation ---
utoipa = { version = "4.2", features = ["axum_extras", "chrono", "uuid"] }
utoipa-swagger-ui = { version = "6.0", features = ["axum"] }

# --- Internal Crates ---
lyxal_core = { path = "./lyxal_core" }
lyxal_schema = { path = "./lyxal_schema" }
