[package]
name = "lyxal_assets"
version = "0.1.0"
edition = "2021"

[dependencies]
lyxal_types = { path = "../lyxal_types" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
nanoid = "0.4"
async-trait = "0.1"
tokio = { version = "1.0", features = ["full"] }
chrono = { version = "0.4", features = ["serde"] }
image = "0.24"
ttf-parser = "0.20"
regex = "1.10"
futures = "0.3"
mime_guess = "2.0"
urlencoding = "2.1"


