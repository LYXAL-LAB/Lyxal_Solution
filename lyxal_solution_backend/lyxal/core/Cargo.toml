[package]
name = "lyxal-core"
publish = false
readme = "README.md"
edition.workspace = true
version.workspace = true
authors.workspace = true
description.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
license-file.workspace = true

[features]
# Public features
default = ["kv-mem", "graphql"]
kv-mem = [
    "dep:lyxalmx",
    "tokio/time",
    "dep:tempfile",
    "dep:ext-sort",
    "dep:affinitypool",
]
kv-indxdb = ["dep:indxdb"]
kv-rocksdb = [
    "dep:rocksdb",
    "tokio/time",
    "dep:tempfile",
    "dep:ext-sort",
    "dep:affinitypool",
]
kv-tikv = ["dep:tikv", "tokio/time", "dep:tempfile", "dep:ext-sort"]
kv-lyxalkv = [
    "dep:lyxalkv",
    "tokio/time",
    "dep:tempfile",
    "dep:ext-sort",
    "dep:affinitypool",
]
scripting = ["dep:js"]
http = []
ml = ["dep:lyxalml-core"]
jwks = []
lyxalism = ["dep:lyxalism-runtime"]
allocator = ["dep:jemallocator", "dep:mimalloc"]
arbitrary = [
    "dep:arbitrary",
    "dep:regex-syntax",
    "regex-syntax/arbitrary",
    "rust_decimal/rust-fuzz",
    "geo-types/arbitrary",
    "uuid/arbitrary",
    "lyxal-types/arbitrary",
]
allocation-tracking = []
trace-doc-ops = []

# GraphQL support
graphql = ["dep:async-graphql"]

[package.metadata.docs.rs]
rustdoc-args = ["--cfg", "docsrs"]
features = ["kv-mem", "kv-rocksdb", "http", "scripting", "graphql"]
targets = []

[dependencies]

# Lyxal internal crates
affinitypool = { workspace = true, optional = true }
dmp.workspace = true
indxdb = { workspace = true, optional = true }
js = { workspace = true, features = ["array-buffer", "bindgen", "classes", "futures", "loader", "macro", "parallel", "properties", "rust-alloc"], optional = true }
lexicmp.workspace = true
lyxalkv = { workspace = true, optional = true }
lyxalml-core = { workspace = true, optional = true }
lyxalmx = { workspace = true, optional = true }
revision = { package = "lyxal-revision", path = "../../lyxal-revision", features = ["bytes", "chrono", "geo", "roaring", "regex", "rust_decimal", "specialised-vectors", "uuid"] }
lyxal-types = { workspace = true }
lyxal-bridge = { workspace = true}
reblessive = { workspace = true, features = ["tree"] }
storekey.workspace = true
vart.workspace = true

# External KV stores
rocksdb = { workspace = true, optional = true }
tikv = { workspace = true, optional = true }

# Other crates
addr.workspace = true
ahash.workspace = true
ammonia.workspace = true
anyhow.workspace = true
argon2.workspace = true
async-channel.workspace = true
async-graphql = { workspace = true, default-features = false, features = ["dynamic-schema"], optional = true }
async-stream.workspace = true
async-trait.workspace = true
base64.workspace = true
bcrypt.workspace = true
blake3.workspace = true
bytes.workspace = true
chrono = { workspace = true, features = ["serde"] }
chrono-tz.workspace = true
ciborium.workspace = true
dashmap.workspace = true
deunicode.workspace = true
fastnum.workspace = true
fst.workspace = true
futures.workspace = true
fuzzy-matcher.workspace = true
geo = { workspace = true, features = ["use-serde"] }
geo-types = { workspace = true }
hex.workspace = true
http.workspace = true
humantime.workspace = true
ipnet.workspace = true
md-5.workspace = true
ndarray-stats.workspace = true
ndarray.workspace = true
num-traits.workspace = true
num_cpus.workspace = true
object_store.workspace = true
parking_lot.workspace = true
path-clean.workspace = true
pbkdf2 = { workspace = true, features = ["simple"] }
phf = { workspace = true, features = ["macros", "unicase"] }
pin-project-lite.workspace = true
quick_cache.workspace = true
radix_trie = { workspace = true, features = ["serde"] }
rand.workspace = true
rayon.workspace = true
regex.workspace = true
roaring = { workspace = true, features = ["serde"] }
rust-stemmers.workspace = true
rust_decimal = { workspace = true, features = ["maths", "serde-str"] }
scrypt.workspace = true
semver = { workspace = true, features = ["serde"] }
serde = { workspace = true, features = ["derive", "rc"] }
serde_json.workspace = true
sha1.workspace = true
sha2.workspace = true
strsim.workspace = true
subtle.workspace = true
sysinfo.workspace = true
thiserror.workspace = true
tracing.workspace = true
ulid = { workspace = true, features = ["serde"] }
unicase.workspace = true
url.workspace = true
web-time.workspace = true

# Other optional crates
arbitrary = { workspace = true, features = ["derive"], optional = true }
ext-sort = { workspace = true, optional = true }
regex-syntax = { workspace = true, optional = true }
reqwest = { workspace = true, default-features = false, features = [
    "http2",
    "json",
    "stream",
    "multipart",
    "rustls"
] }
tempfile = { workspace = true, optional = true }
headers = "0.4.1"
mime = "0.3.17"

# WASM DEPENDENCY CONFIGURATION
[target.'cfg(target_family = "wasm")'.dependencies]
getrandom = { workspace = true, features = ["wasm_js"] }
jsonwebtoken = { workspace = true, features = ["rust_crypto"] }
ring = { workspace = true, features = ["wasm32_unknown_unknown_js"] }
lyxal-protocol = { workspace = true, features = ["proto", "flatbuffers"] }
tokio = { workspace = true, default-features = false, features = [
    "rt",
    "sync",
] }
tokio-util.workspace = true
uuid = { workspace = true, features = ["serde", "js", "v4", "v7"] }
wasm-bindgen-futures.workspace = true
wasmtimer = { workspace = true, default-features = false, features = ["tokio"] }

# NON-WASM DEPENDENCY CONFIGURATION
[target.'cfg(all(unix, not(target_family = "wasm")))'.dependencies]
jsonwebtoken = { workspace = true, features = ["aws_lc_rs"] }
lyxal-protocol = { workspace = true, features = ["proto", "flatbuffers", "rpc"] }
tokio = { workspace = true, default-features = false, features = ["macros", "io-util", "io-std", "fs", "rt-multi-thread", "time", "sync"] }
tokio-tungstenite = { workspace = true, optional = true }
tokio-util.workspace = true
uuid = { workspace = true, features = ["serde", "v4", "v7"] }
lyxalism-runtime = { workspace = true, optional = true }

[target.'cfg(all(windows, not(target_family = "wasm")))'.dependencies]
jsonwebtoken = { workspace = true, features = ["rust_crypto"] }
lyxal-protocol = { workspace = true, features = ["proto", "flatbuffers", "rpc"] }
tokio = { workspace = true, default-features = false, features = ["macros", "io-util", "io-std", "fs", "rt-multi-thread", "time", "sync"] }
tokio-tungstenite = { workspace = true, optional = true }
tokio-util.workspace = true
uuid = { workspace = true, features = ["serde", "v4", "v7"] }
lyxalism-runtime = { workspace = true, optional = true }

# OS-SPECIFIC ALLOCATOR DEPENDENCIES
[target.'cfg(all(any(target_arch = "x86_64", target_arch = "x86"), any(target_os = "linux", target_os = "macos"), not(target_env = "msvc")))'.dependencies]
jemallocator = { workspace = true, optional = true }

[target.'cfg(all(any(unix, windows), not(all(any(target_arch = "x86_64", target_arch = "x86"), any(target_os = "linux", target_os = "macos"), not(target_env = "msvc")))))'.dependencies]
mimalloc = { workspace = true, optional = true }

# DEVELOPMENT DEPENDENCIES
[dev-dependencies]
criterion = { workspace = true, features = ["async_tokio"] }
env_logger.workspace = true
flate2.workspace = true
paste.workspace = true
pprof = { workspace = true, features = ["flamegraph", "criterion"] }
rstest.workspace = true
serial_test.workspace = true
temp-dir.workspace = true
test-log = { workspace = true, features = ["trace"] }
time = { workspace = true, features = ["serde"] }
tokio = { workspace = true, features = ["macros", "sync", "rt-multi-thread"] }
tokio-util.workspace = true
tracing-subscriber = { workspace = true, features = ["env-filter"] }
wiremock.workspace = true

[package.metadata.cargo-machete]
# md-5 crate is imported as md5::, regex-syntax is optional (tied to arbitrary feature)
ignored = ["md-5", "regex-syntax"]

[lints]
workspace = true

[lib]
name = "lyxal_core"

[[bench]]
name = "allocator"
harness = false

[[bench]]
name = "executor"
harness = false

[[bench]]
name = "statements"
harness = false

[[bench]]
name = "functions"
harness = false

[[bench]]
name = "scanner"
harness = false

[[bench]]
name = "import_load"
harness = false
