[workspace]
members = [
    # Root package
    ".",
    # lyxal crates
    "lyxal",
    "lyxal/core",
    "lyxal/server",
    "lyxal/types",
    "lyxal/types/derive",

    # lyxal apps crates
    "lyxal_apps/lyxal-bridge",

    # lyxal-crates crates

    # lyxalkv crates
    "lyxalkv",

    # lyxalism crates
    "lyxalism",
    "lyxalism/demo",
    "lyxalism/macros",
    "lyxalism/runtime",
    "lyxalism/types",

    # lyxalml crates
    "lyxalml/core",

    # lyxalmx crates
    "lyxalmx",

    # lyxal-protocol crates
    "lyxal-protocol",

    # lyxal-revision crates
    "lyxal-revision",
    "lyxal-revision/lyxal-revision-derive",

    # Other
    "profiling",
]
resolver = "2"

[workspace.package]
authors = ["Lyxal <team@lyxal.io>"]
license-file = "LICENSE"
publish = false
version = "0.1.0"
edition = "2024"
description = "Lyxal Solution - Infrastructure Backend"
repository = "https://github.com/lyxal/lyxal_solution"
homepage = "https://lyxal.io"
keywords = ["lyxal", "database", "proxy"]
categories = ["database", "network-programming"]

[workspace.dependencies]

# ── Internal Lyxal crates ──

# Lyxal crates
lyxal = { path = "lyxal" }
lyxal-core = { path = "lyxal/core", default-features = false }
lyxal-server = { path = "lyxal/server", default-features = false }
lyxal-types = { path = "lyxal/types" }
lyxal-types-derive = { path = "lyxal/types/derive" }

# Lyxal apps crates
lyxal-bridge = { path = "lyxal_apps/lyxal-bridge" }

# Lyxalism crates
lyxalism = { path = "lyxalism" }
lyxalism-macros = { path = "lyxalism/macros", default-features = false }
lyxalism-runtime = { path = "lyxalism/runtime" }
lyxalism-types = { path = "lyxalism/types", default-features = false }

# Lyxalkv crates
lyxalkv = { path = "lyxalkv" }

# Lyxalml crates
lyxalml-core = { path = "lyxalml/core" }

# Lyxalmx crates
lyxalmx = { path = "lyxalmx" }

# Lyxal-protocol crates
lyxal-protocol = { path = "lyxal-protocol" }

# Lyxal-revision crates
lyxal-revision = { path = "lyxal-revision" }
lyxal-revision-derive = { path = "lyxal-revision/lyxal-revision-derive" }

# ── External Lyxal Crates (To Fork) ──
affinitypool = "0.4.0"
dmp = "0.2.3"
indxdb = "0.11.0"
js = { version = "0.11.0", package = "rquickjs", features = ["rust-alloc"] }
