[workspace.lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(docker)', 'cfg(storage)'] }

[workspace.lints.clippy]
# Checks for usage of `#[allow]` attribute and suggests replacing it with `#[expect]`.
allow_attributes = "allow"

# Checks for code like `foo = bar.clone();`.
assigning_clones = "warn"

# This lint allows boolean comparisons in assert-like macros.
bool_assert_comparison = "allow"

# Checks for the usage of `as _` conversion using inferred type.
cloned_instead_of_copied = "warn"

# Checks for function/method calls with a mutable parameter in macros.
debug_assert_with_mut_call = "warn"

# Denies the configured methods and functions in `clippy.toml`.
disallowed_methods = "warn"

# Checks for explicit `.into_iter()` calls in for loops.
explicit_into_iter_loop = "warn"

# Checks for impls of `From<..>` that contain `panic!()` or `unwrap()`
fallible_impl_from = "warn"

# Checks for usage of `.get().unwrap()` on an Index type.
get_unwrap = "warn"

# Checks for the usage of `implicit_clone` instead of `.clone()`.
implicit_clone = "warn"

# Checks for usage of `.to_string()` on an `&&T`.
inefficient_to_string = "warn"

# Checks for large types being passed by value.
large_types_passed_by_value = "warn"

# Checks for whole number float literals that lose precision.
lossy_float_literal = "warn"

# Checks for binding to underscore prefixed variable.
no_effect_underscore_binding = "warn"

# Checks for Option usage.
option_as_ref_cloned = "warn"

# Checks for unnecessary clone calls.
redundant_clone = "warn"

# Checks for double lookups.
set_contains_or_insert = "warn"

# Checks for excessive allocations.
unnecessary_to_owned = "warn"

# Disables warning for unused async because async is used to prevent stack overflow.
unused_async = "allow"

# Checks for unwrap usage.
unwrap_used = "warn"

# Checks for underscore usage.
used_underscore_binding = "warn"

# Profiles
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = 'abort'
strip = true

[profile.bench]
strip = false

[profile.make]
inherits = "dev"

[profile.profiling]
debug = true
inherits = "release"
strip = false
panic = 'unwind'
