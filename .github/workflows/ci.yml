# Intégration continue du workspace Lyxal OS.
# Chaque job appelle un script de scripts/ci/ : `scripts/ci/ci_local.sh` rejoue la même chose en local.
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  SURREAL_VERSION: "3.3.4"

jobs:
  fmt:
    name: Formatage
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: Installer Rust (version de rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - run: cargo fmt --all -- --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - name: Installer Rust (version de rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: clippy
      - run: scripts/ci/clippy.sh

  surql:
    name: SurrealQL
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - run: scripts/ci/install_surreal.sh
      - run: scripts/ci/validate_surql.sh
      - name: Bibliothèque lyxal_core
        run: python3 -I scripts/ci/test_lyxal_core.py

  test:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - name: Libérer de l'espace disque si nécessaire
        run: |
          df -h /
          available_gb=$(df --output=avail -BG / | tail -1 | tr -dc '0-9')
          if [ "${available_gb}" -lt 20 ]; then
            sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
            df -h /
          fi
      - name: Installer Rust (version de rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: test
      - run: scripts/ci/install_surreal.sh
      - run: scripts/ci/test_all.sh
      - name: Espace disque utilisé
        if: always()
        run: df -h / && du -sh target || true
