[workspace]
resolver = "2"
members = ["app", "server"]

[workspace.dependencies]
pulldown-cmark = "0.12"
syntect = { version = "5.3", default-features = false, features = ["html", "parsing", "default-fancy", "regex-fancy"] }
reqwest = { version = "0.12", features = ["json"] }
leptos_ui = "0.3"
icons = { version = "0.18", features = ["leptos"] }
anyhow = "1"
axum = { version = "0.8", features = ["macros"] }
console_error_panic_hook = "0.1"
console_log = "1"
dotenv = "0.15"
http = "1"
leptos = { version = "0.8", features = ["nightly"] }
leptos_axum = "0.8"
leptos_meta = "0.8"
leptos_router = { version = "0.8", features = ["nightly"] }
log = "0.4"
tw_merge = { version = "0.1", features = ["variant", "debug"]}
strum = { version = "0.27", features = ["derive"] }
strum_macros = "0.27"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["fs"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["MediaQueryList", "Storage", "Window", "Navigator", "Clipboard", "Request", "RequestInit", "RequestMode", "Response", "Headers", "ReadableStream", "ReadableStreamDefaultReader"] }
js-sys = "0.3"
validator = { version = "0.20.0", features = ["derive"] }
serde_json = "1"
time = { version = "0.3.47", features = ["wasm-bindgen", "formatting", "parsing", "macros"] }
serde = "1.0.228"

[[workspace.metadata.leptos]]
name = "lyxal_web"
bin-package = "server"
lib-package = "app"
site-root = "target/site"
assets-dir = "public"
site-pkg-dir = "pkg"
tailwind-input-file = "style/tailwind.css"
site-addr = "0.0.0.0:3000"
reload-port = 3001
browserquery = "defaults"
watch = false
env = "DEV"
bin-features = []
bin-default-features = false
lib-features = ["hydrate"]
lib-default-features = false
