[package]
name = "lyxal-mcp"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "MCP Server: expose Lyxal's scheduler to AI assistants via the Model Context Protocol"

[[bin]]
name = "lyxal-mcp"
path = "src/main.rs"

[dependencies]
lyxal-runner = { path = "../lyxal-runner" }
lyxal-store = { path = "../lyxal-store" }
lyxal-config = { path = "../lyxal-config" }
lyxal-scheduler = { path = "../lyxal-scheduler" }
lyxal-execution = { path = "../lyxal-execution" }
rmcp = { version = "~1.5", features = [
    "server",
    "macros",
    "transport-io",
    "transport-streamable-http-server",
] }
lyxal-auth = { path = "../lyxal-auth" }
http = "1"
tower-service = "0.3"
schemars = { version = "1.0", features = ["chrono04"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
pretty_assertions = "1"
tokio = { version = "1", features = ["full", "test-util"] }
