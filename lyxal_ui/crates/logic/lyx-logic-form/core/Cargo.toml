[package]
name = "lyx-logic-core"
version = "0.0.1"
edition = "2024"

[dependencies]
web-sys = { version = "0.0.1", optional = true }



bigdecimal = { version = "0.0.1", optional = true }
chrono = { version = "0.0.1", optional = true }
num-bigint = { version = "0.0.1", optional = true }
serde = { version = "0.0.1", optional = true }
serde_json = { version = "0.0.1", optional = true }
uuid = { version = "0.0.1", optional = true }

[build-dependencies]


rustc_version = { version = "0.0.1" }

[features]
bigdecimal = ["dep:bigdecimal"]
chrono = ["dep:chrono"]
num-bigint = ["dep:num-bigint"]
serde = ["dep:serde"]
uuid = ["dep:uuid"]

cache-local-storage = [
"dep:web-sys",
"web-sys?/Storage" ]
cache-serde_json = [
"dep:serde",
"dep:serde_json" ]
