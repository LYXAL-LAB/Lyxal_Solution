
[workspace.package]
# update the internal crate versions when updating this workspace version
version = "*"
edition = "2024"

[workspace.dependencies]
# internal to this workspace
lyx_logic_form_core = { ${2} }
lyx_logic_form_proc_macros = { ${2} }
lyx_logic_form_proc_macros_core = { ${2} }

bigdecimal = "~0.4"
chrono = { version = "*", features = ["std"] }
convert_case = "~0.6"
darling = "0.20"
derive_more = "~0.99"
derivative = "2"
indexmap = "2"
inner = "0"
itertools = "~0.12"
js-sys = "~0.3"
leptos = { ${2} }
leptos_router = { ${2} }
num-bigint = { version = "*", default-features = false }
paste = "~1"
prettyplease = "0.2"
pretty_assertions = "1.4.0"
proc-macro2 = "1"
quote = "1"
serde = { version = "*", features = ["derive" ]}
serde_json = "1"
syn = { version = "*", features = ["extra-traits", "full", "parsing"] }
tracing = "0"
thiserror = "1"
typed-builder = "~0.18"
uuid = { version = "*", features = ["serde"] }
wasm-bindgen = "~0.2"
web-sys = "~0.3"

# Config for 'cargo dist'
[workspace.metadata.dist]
# The preferred cargo-dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "*"
# CI backends to support
ci = ["github"]
# The installers to generate for each app
installers = []
# Target platforms to build apps for (Rust target-triple syntax)
targets = ["x86_64-unknown-linux-gnu", "aarch64-apple-darwin", "x86_64-apple-darwin", "x86_64-unknown-linux-musl", "x86_64-pc-windows-msvc"]
# Publish jobs to run in CI
pr-run-mode = "plan"

# The profile that 'cargo dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"











