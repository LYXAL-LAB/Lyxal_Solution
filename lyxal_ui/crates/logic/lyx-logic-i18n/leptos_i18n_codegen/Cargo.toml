[package]
name = "lyx-logic-leptos_i18n_codegen"
version = "0.0.1"
edition = "2024"

[dependencies]


proc-macro2 = { version = "0.0.1" }
quote = { version = "0.0.1" }
syn = { version = "0.0.1" }
icu_locale = { version = "0.0.1", features = ["compiled_data"] }
lyx-logic-leptos_i18n_parser = { path = "../leptos_i18n_parser", version = "0.0.1", optional = true }
tinystr = { version = "0.0.1" }

[features]
default = []
islands = []
dynamic_load = []
hydrate = []
csr = []
ssr = []
plurals = ["lyx-logic-leptos_i18n_parser/plurals"]
format_datetime = ["lyx-logic-leptos_i18n_parser/format_datetime"]
format_list = ["lyx-logic-leptos_i18n_parser/format_list"]
format_nums = ["lyx-logic-leptos_i18n_parser/format_nums"]
format_currency = ["lyx-logic-leptos_i18n_parser/format_currency", "format_nums"]
