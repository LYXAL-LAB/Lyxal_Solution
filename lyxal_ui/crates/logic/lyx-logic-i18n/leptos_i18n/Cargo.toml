[package]
name = "leptos_i18n"
version = "0.8.0"
edition = "2024"

[dependencies]
leptos-use = { path = "../../use", features = ["use_locales"], optional = true }
leptos_i18n_macro = { path = "../leptos_i18n_macro", optional = true }
leptos = { path = "../core/lyx-core-leptos/leptos", optional = true }
leptos_meta = { path = "../core/lyx-core-leptos/meta", optional = true }
codee = { version = "*" }
icu_locale = { version = "*" }
icu_provider = { version = "*", optional = true, features = ["sync"] }
icu_plurals = { version = "*", optional = true }
icu_datetime = { version = "*", optional = true }
icu_calendar = { version = "*", optional = true }
icu_list = { version = "*", optional = true }
icu_decimal = { version = "*", optional = true }
typed-builder = { version = "*" }
fixed_decimal = { version = "*", optional = true, features = ["ryu"] }
icu_experimental = { version = "*", optional = true, features = ["ryu"] }
writeable = { version = "*" }
serde = { version = "*" }
async-once-cell = { version = "*", optional = true }
js-sys = { version = "*", optional = true }
serde-wasm-bindgen = { version = "*", optional = true }
futures = { version = "*", optional = true }
default-struct-builder = { version = "*" }
wasm-bindgen = { version = "*" }
tinystr = { version = "*", optional = true }
serde_json = { version = "*", optional = true }

[features]
default = ["cookie", "icu_compiled_data"]

cookie = []
icu_compiled_data = [
"icu_plurals?/compiled_data",
"icu_datetime?/compiled_data",
"icu_calendar?/compiled_data",
"icu_list?/compiled_data",
"icu_decimal?/compiled_data",
"icu_experimental?/compiled_data",
"leptos_i18n_macro/icu_compiled_data" ]
nightly = ["leptos/nightly"]

# Formatting features
all_formats = [
"plurals",
"format_datetime",
"format_list",
"format_nums",
"format_currency" ]
plurals = ["dep:icu_plurals", "dep:icu_provider", "leptos_i18n_macro/plurals"]
format_datetime = [
"dep:icu_datetime",
"dep:icu_calendar",
"dep:icu_provider",
"leptos_i18n_macro/format_datetime" ]
format_list = [
"dep:icu_list",
"dep:icu_provider",
"leptos_i18n_macro/format_list" ]
format_nums = [
"dep:icu_decimal",
"dep:fixed_decimal",
"dep:icu_provider",
"leptos_i18n_macro/format_nums" ]
format_currency = [
"format_nums",
"dep:tinystr",
"dep:icu_experimental",
"dep:icu_provider",
"leptos_i18n_macro/format_currency" ]

# Target features
actix = ["ssr", "leptos-use/actix"]
axum = ["ssr", "leptos-use/axum"]
hydrate = [
"leptos/hydrate",
"leptos_i18n_macro/hydrate",
"dep:js-sys",
"dep:serde-wasm-bindgen" ]
csr = ["leptos/csr", "leptos_i18n_macro/csr"]
ssr = [
"leptos/ssr",
"leptos_meta/ssr",
"leptos-use/ssr",
"leptos_i18n_macro/ssr" ]
islands = ["leptos/islands", "leptos_i18n_macro/islands"]
dynamic_load = [
"leptos_i18n_macro/dynamic_load",
"dep:async-once-cell",
"dep:futures",
"dep:serde_json" ]

# Features needed for the doctests











