[workspace]
resolver = "2"
members = [
    "thaw",
    "thaw_components",
    "thaw_macro",
    "thaw_utils",
    "demo",
    "demo_markdown",
]
exclude = ["examples"]

[workspace.package]
rust-version = "1.75.0"

[workspace.dependencies]
thaw = { ${2} }
thaw_components = { ${2} }
thaw_macro = { ${2} }
thaw_utils = { ${2} }

# leptos
leptos = { version = "*" }
leptos_meta = { version = "*" }
leptos_router = { version = "*" }
reactive_stores = { version = "*" }

# web
wasm-bindgen = { version = "*" }


[patch.crates-io]
leptos = { path = "../../core/lyx-core-leptos/leptos" }
leptos_meta = { path = "../../core/lyx-core-leptos/meta" }
leptos_router = { path = "../../core/lyx-core-leptos/router" }
leptos_axum = { path = "../../core/lyx-core-leptos/integrations/axum" }
