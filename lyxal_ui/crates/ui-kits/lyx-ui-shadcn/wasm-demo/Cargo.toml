[package]
name = "lyx-ui-wasm-demo"
version = "0.8.0"
edition = "2024"
[lib]
crate-type = ["cdylib"]
[dependencies]
# Leptos framework (using workspace dependencies)
leptos = { path = "../core/lyx-core-leptos/leptos", features = ["csr"] }
leptos-shadcn-ui-wasm = { path = "../packages/leptos-shadcn-ui-wasm" }
# WASM-specific dependencies (using workspace where available)
wasm-bindgen = { version = "*" }
console_error_panic_hook = { version = "*" }
web-sys = { version = "*", features = ["console", "Document", "Element", "HtmlElement", "Window", "Performance" ] }
[dev-dependencies]
wasm-bindgen-test = { version = "*" }










