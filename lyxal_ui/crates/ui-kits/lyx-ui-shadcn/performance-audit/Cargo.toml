[package]
name = "lyx-ui-performance-audit"
version = "0.8.0"
edition = "2024"
[dependencies]
# Core dependencies
tokio = { version = "*", features = ["full"] }
serde = { version = "*", features = ["derive"] }
serde_json = { version = "*" }
anyhow = { version = "*" }
thiserror = { version = "*" }
# File system and path handling
walkdir = { version = "*" }
glob = { version = "*" }
# Time and duration handling
chrono = { version = "*", features = ["serde"] }
# Async runtime
futures = { version = "*" }
# Logging
log = { version = "*" }
env_logger = { version = "*" }
# Statistics and math
online-statistics = { version = "*" }
nalgebra = { version = "*" }
# Random number generation
rand = { version = "*" }
# HTTP client
reqwest = { version = "*", features = ["json"] }
[dev-dependencies]
# Testing dependencies
criterion = { version = "*" }
proptest = { version = "*" }
tempfile = { version = "*" }
# Async testing
tokio-test = { version = "*" }
[features]
default = ["monitoring", "benchmarks"]
monitoring = []
benchmarks = []
cli = ["dep:indicatif"]
web = ["dep:wasm-bindgen", "dep:web-sys"]
# CLI dependencies
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
clap = { version = "*", features = ["derive"] }
indicatif = { version = "*" , optional = true }
# Web dependencies (optional)
[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = { version = "*" , optional = true }
web-sys = { version = "*" , optional = true }
js-sys = { version = "*" }





