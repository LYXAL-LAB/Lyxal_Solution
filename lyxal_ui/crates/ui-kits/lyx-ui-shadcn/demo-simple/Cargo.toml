[package]
name = "lyx-ui-demo-simple"
version = "0.8.0"
edition = "2024"
[dependencies]
# Leptos framework with SSR
leptos = { path = "../../../core/lyx-core-leptos/leptos", features = ["ssr"] }
leptos_axum = { path = "../../../core/lyx-core-leptos/integrations/axum", features = ["ssr"] }
leptos_meta = { path = "../../../core/lyx-core-leptos/meta", features = ["ssr"] }
leptos_router = { path = "../../../core/lyx-core-leptos/router", features = ["ssr"] }
# Server dependencies
leptos_axum = { version = "*" }
tokio = { version = "*", features = ["full"] }
tower = { version = "*" }
tower-http = { version = "*", features = ["fs", "cors"] }
tracing = { version = "*" }
tracing-subscriber = { version = "*" }
# Local components
leptos-shadcn-button = { path = "../packages/leptos/button" }
leptos-shadcn-card = { path = "../packages/leptos/card" }
leptos-shadcn-input = { path = "../packages/leptos/input" }
# Tailwind-RS
tailwind-rs-core = { path = "../packages/tailwind-rs-core" }
tailwind-rs-leptos = { version = "*" }
# UUID support
uuid = { version = "*", features = ["v4"] }
# Binary target
[[bin]]
name = "lyx-ui-demo-simple"
path = "src/lib.rs"











