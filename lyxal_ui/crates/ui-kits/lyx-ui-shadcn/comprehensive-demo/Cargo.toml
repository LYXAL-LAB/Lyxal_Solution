[package]
name = "lyx-ui-comprehensive-demo"
version = "0.0.1"
edition = "2024"
[dependencies]
# Leptos framework
lyx-core-leptos = { path = "../../../core/lyx-core-leptos/leptos", version = "0.0.1", features = ["csr"] }
lyx-core-meta = { path = "../../../core/lyx-core-leptos/meta", version = "0.0.1" }
# WASM dependencies
console_error_panic_hook = { version = "0.0.1" }
console_log = { version = "0.0.1" }
log = { version = "0.0.1" }
wasm-bindgen = { version = "0.0.1" }
web-sys = { version = "0.0.1" }
js-sys = { version = "0.0.1" }
getrandom = { version = "0.0.1", features = ["js"] }
uuid = { version = "0.0.1", features = ["v4", "js"] }
# Tailwind-RS
tailwind-rs-core = { path = "../packages/tailwind-rs-core", version = "0.0.1" }
tailwind-rs-leptos = { version = "0.0.1" }
# Published ShadCN UI components v0.9.1 (refactored versions)
leptos-shadcn-drawer = { path = "../packages/leptos/drawer", version = "0.0.1" }
leptos-shadcn-context-menu = { path = "../packages/leptos/context-menu", version = "0.0.1" }
leptos-shadcn-alert-dialog = { path = "../packages/leptos/alert-dialog", version = "0.0.1" }
leptos-shadcn-select = { path = "../packages/leptos/select", version = "0.0.1" }
leptos-shadcn-command = { path = "../packages/leptos/command", version = "0.0.1" }
# Additional components for comprehensive demo
leptos-shadcn-button = { path = "../packages/leptos/button", version = "0.0.1" }
leptos-shadcn-card = { path = "../packages/leptos/card", version = "0.0.1" }
leptos-shadcn-input = { path = "../packages/leptos/input", version = "0.0.1" }
leptos-shadcn-dialog = { path = "../packages/leptos/dialog", version = "0.0.1" }
leptos-shadcn-dropdown-menu = { path = "../packages/leptos/dropdown-menu", version = "0.0.1" }
leptos-shadcn-popover = { path = "../packages/leptos/popover", version = "0.0.1" }
leptos-shadcn-tooltip = { path = "../packages/leptos/tooltip", version = "0.0.1" }
leptos-shadcn-toast = { path = "../packages/leptos/toast", version = "0.0.1" }
leptos-shadcn-accordion = { path = "../packages/leptos/accordion", version = "0.0.1" }
leptos-shadcn-tabs = { path = "../packages/leptos/tabs", version = "0.0.1" }
leptos-shadcn-switch = { path = "../packages/leptos/switch", version = "0.0.1" }
leptos-shadcn-checkbox = { path = "../packages/leptos/checkbox", version = "0.0.1" }
leptos-shadcn-radio-group = { path = "../packages/leptos/radio-group", version = "0.0.1" }
leptos-shadcn-slider = { path = "../packages/leptos/slider", version = "0.0.1" }
leptos-shadcn-progress = { path = "../packages/leptos/progress", version = "0.0.1" }
leptos-shadcn-badge = { path = "../packages/leptos/badge", version = "0.0.1" }
leptos-shadcn-avatar = { path = "../packages/leptos/avatar", version = "0.0.1" }
leptos-shadcn-separator = { path = "../packages/leptos/separator", version = "0.0.1" }
leptos-shadcn-skeleton = { path = "../packages/leptos/skeleton", version = "0.0.1" }
[lib]
crate-type = ["cdylib"]
