[package]
name = "lyx-ui-gh-pages-demo"
version = "0.8.0"
edition = "2024"
[dependencies]
# Leptos framework
leptos = { path = "../../../core/lyx-core-leptos/leptos", features = ["csr"] }
leptos_meta = { path = "../../../core/lyx-core-leptos/meta" }
# WASM dependencies
console_error_panic_hook = { version = "*" }
console_log = { version = "*" }
log = { version = "*" }
wasm-bindgen = { version = "*" }
web-sys = { version = "*" }
js-sys = { version = "*" }
getrandom = { version = "*", features = ["js"] }
uuid = { version = "*", features = ["v4", "js"] }
# Tailwind-RS
tailwind-rs-core = { path = "../packages/tailwind-rs-core" }
tailwind-rs-wasm = { version = "*" }
# Published ShadCN UI components (refactored versions)
leptos-shadcn-drawer = { path = "../packages/leptos/drawer" }
leptos-shadcn-context-menu = { path = "../packages/leptos/context-menu" }
leptos-shadcn-alert-dialog = { path = "../packages/leptos/alert-dialog" }
leptos-shadcn-select = { path = "../packages/leptos/select" }
leptos-shadcn-command = { path = "../packages/leptos/command" }
# Additional components for comprehensive demo
leptos-shadcn-button = { path = "../packages/leptos/button" }
leptos-shadcn-card = { path = "../packages/leptos/card" }
leptos-shadcn-input = { path = "../packages/leptos/input" }
[lib]
crate-type = ["cdylib"]










