[package]
name = "lyx-ui-api-standards"
version = "0.8.0"
edition = "2024"
[dependencies]
# Core dependencies
leptos = { path = "../../../../core/lyx-core-leptos/leptos", features = ["csr", "hydrate"] }
serde = { version = "*", features = ["derive"] }
serde_json = { version = "*" }
thiserror = { version = "*" }
# Validation and testing
regex = { version = "*" }
chrono = { version = "*", features = ["serde"] }
# CSS utilities
cssparser = { version = "*" }
[dev-dependencies]
tokio-test = { version = "*" }
tempfile = { version = "*" }
[features]
default = ["validation", "linting"]
validation = []
linting = []
testing = []










