leptos-shadcn-dropdown-menu = { path = "../leptos/dropdown-menu", version = "0.0.1", optional = true }
leptos-shadcn-menubar = { path = "../leptos/menubar", version = "0.0.1", optional = true }
leptos-shadcn-hover-card = { path = "../leptos/hover-card", version = "0.0.1", optional = true }
leptos-shadcn-aspect-ratio = { path = "../leptos/aspect-ratio", version = "0.0.1", optional = true }
leptos-shadcn-collapsible = { path = "../leptos/collapsible", version = "0.0.1", optional = true }
leptos-shadcn-scroll-area = { path = "../leptos/scroll-area", version = "0.0.1", optional = true }
leptos-shadcn-sheet = { path = "../leptos/sheet", version = "0.0.1", optional = true }
leptos-shadcn-drawer = { path = "../leptos/drawer", version = "0.0.1", optional = true }
leptos-shadcn-alert-dialog = { path = "../leptos/alert-dialog", version = "0.0.1", optional = true }
leptos-shadcn-avatar = { path = "../leptos/avatar", version = "0.0.1", optional = true }
leptos-shadcn-resizable = { path = "../leptos/resizable", version = "0.0.1", optional = true }
leptos-shadcn-performance-audit = { path = "../../performance-audit", version = "0.0.1", optional = true }
# Additional packages (published dependencies for v0.9.0 release)
leptos-shadcn-error-boundary = { path = "../leptos/error-boundary", version = "0.0.1", optional = true }
leptos-shadcn-lazy-loading = { path = "../leptos/lazy-loading", version = "0.0.1", optional = true }
leptos-shadcn-registry = { path = "../leptos/registry", version = "0.0.1", optional = true }
leptos-shadcn-analytics = { path = "../leptos/analytics", version = "0.0.1", optional = true }
# Additional dependencies
tailwind_fuse = { path = "../../../../ui-foundations/lyx-found-tailwind/fuse", version = "0.0.1" }
gloo-timers = { version = "0.0.1" }
# WASM-compatible dependencies
getrandom = { version = "0.0.1", features = ["js"] }
uuid = { version = "0.0.1", features = ["v4", "js"] }
[features]
default = ["all-components"]
all-components = [
"button", "input", "label", "checkbox", "switch", "radio-group", "select", "textarea",
"card", "separator", "tabs", "accordion", "dialog", "popover", "tooltip",
"alert", "badge", "skeleton", "progress", "toast", "table", "calendar", "date-picker", "pagination",
"slider", "toggle", "carousel",
"form", "combobox", "command", "input-otp", "breadcrumb", "navigation-menu", "context-menu",
"dropdown-menu", "menubar", "hover-card", "aspect-ratio", "collapsible", "scroll-area",
"sheet", "drawer", "alert-dialog", "avatar", "resizable", "error-boundary", "lazy-loading", "performance-audit",
"analytics"
]
# Individual component features
button = ["leptos-shadcn-button"]
input = ["leptos-shadcn-input"]
