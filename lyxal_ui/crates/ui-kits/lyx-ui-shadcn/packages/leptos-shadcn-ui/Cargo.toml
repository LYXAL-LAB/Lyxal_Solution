[package]
name = "lyx-ui-leptos-shadcn-ui"
version = "0.0.1"
edition = "2024"
[dependencies]
# Core Leptos dependencies (v0.8.x)
lyx-core-leptos = { path = "../../../../core/lyx-core-leptos/leptos", version = "0.0.1", optional = true }
lyx-core-router = { path = "../../../../core/lyx-core-leptos/router", version = "0.0.1" }
leptos-node-ref = { version = "0.0.1" }
leptos-struct-component = { version = "0.0.1" }
leptos-style = { version = "0.0.1" }
# Individual component packages (published dependencies for v0.9.0 release)
leptos-shadcn-button = { path = "../leptos/button", version = "0.0.1", optional = true }
leptos-shadcn-input = { path = "../leptos/input", version = "0.0.1", optional = true }
leptos-shadcn-label = { path = "../leptos/label", version = "0.0.1", optional = true }
