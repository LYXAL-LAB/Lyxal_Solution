leptos-shadcn-textarea = { path = "../leptos/textarea", version = "0.0.1", optional = true }
leptos-shadcn-card = { path = "../leptos/card", version = "0.0.1", optional = true }
leptos-shadcn-separator = { path = "../leptos/separator", version = "0.0.1", optional = true }
leptos-shadcn-tabs = { path = "../leptos/tabs", version = "0.0.1", optional = true }
leptos-shadcn-accordion = { path = "../leptos/accordion", version = "0.0.1", optional = true }
leptos-shadcn-dialog = { path = "../leptos/dialog", version = "0.0.1", optional = true }
leptos-shadcn-popover = { path = "../leptos/popover", version = "0.0.1", optional = true }
leptos-shadcn-tooltip = { path = "../leptos/tooltip", version = "0.0.1", optional = true }
leptos-shadcn-alert = { path = "../leptos/alert", version = "0.0.1", optional = true }
leptos-shadcn-badge = { path = "../leptos/badge", version = "0.0.1", optional = true }
leptos-shadcn-skeleton = { path = "../leptos/skeleton", version = "0.0.1", optional = true }
leptos-shadcn-progress = { path = "../leptos/progress", version = "0.0.1", optional = true }
leptos-shadcn-toast = { path = "../leptos/toast", version = "0.0.1", optional = true }
leptos-shadcn-table = { path = "../leptos/table", version = "0.0.1", optional = true }
leptos-shadcn-calendar = { path = "../leptos/calendar", version = "0.0.1", optional = true }
leptos-shadcn-date-picker = { path = "../leptos/date-picker", version = "0.0.1", optional = true }
leptos-shadcn-pagination = { path = "../leptos/pagination", version = "0.0.1", optional = true }
leptos-shadcn-slider = { path = "../leptos/slider", version = "0.0.1", optional = true }
leptos-shadcn-toggle = { path = "../leptos/toggle", version = "0.0.1", optional = true }
leptos-shadcn-carousel = { path = "../leptos/carousel", version = "0.0.1", optional = true }
# Advanced components (published dependencies for v0.9.0 release)
leptos-shadcn-form = { path = "../leptos/form", version = "0.0.1", optional = true }
leptos-shadcn-combobox = { path = "../leptos/combobox", version = "0.0.1", optional = true }
leptos-shadcn-command = { path = "../leptos/command", version = "0.0.1", optional = true }
leptos-shadcn-input-otp = { path = "../leptos/input-otp", version = "0.0.1", optional = true }
