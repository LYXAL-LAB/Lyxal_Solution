[package]
name = "lyx-ui-test-utils"
version = "0.8.0"
edition = "2024"
[dependencies]
wasm-bindgen-test = { version = "*" }
web-sys = { version = "*", features = ["console", "Document", "Element", "HtmlElement", "Window", "Performance", "PerformanceTiming"] }
js-sys = { version = "*" }
console_error_panic_hook = { version = "*" }
serde = { version = "*" }
serde_json = { version = "*" }
# âœ… FIXED: Add "js" feature for WASM compatibility
uuid = { version = "*", features = ["v4", "js"] }
# Framework-specific testing
leptos = { path = "../../../../core/lyx-core-leptos/leptos" }
# âœ… ADDED: WASM-compatible random generation
getrandom = { version = "*", features = ["js"] }
# Snapshot testing dependencies
chrono = { version = "*" }
[features]
default = []
wasm-testing = []
native-testing = []
# Conditional dependencies for different targets
[target.'cfg(target_arch = "wasm32")'.dependencies]
# WASM-specific testing utilities
wasm-bindgen-futures = { version = "*" }
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# Native-only testing utilities
proptest = { version = "*" }
tempfile = { version = "*" }










