[package]
name = "lyx-ui-form"
version = "0.0.1"
edition = "2024"
[dependencies]
chrono = { version = "0.0.1" }
leptos-style = { version = "0.0.1" }
web-sys = { version = "0.0.1", features = ["HtmlFormElement", "HtmlInputElement", "HtmlElement", "Element", "Node", "Event", "EventTarget", "SubmitEvent"] }
wasm-bindgen = { version = "0.0.1" }
tailwind_fuse = { path = "../../../../../ui-foundations/lyx-found-tailwind/fuse", version = "0.0.1" }
leptos-shadcn-input = { path = "../input", version = "0.0.1" }
leptos-shadcn-button = { path = "../button", version = "0.0.1" }
gloo-timers = { version = "0.0.1" }
leptos-struct-component = { version = "0.0.1" }
leptos-shadcn-signal-management = { path = "../../signal-management", version = "0.0.1" }
[dev-dependencies]
shadcn-ui-test-utils = { path = "../../test-utils", version = "0.0.1" }
wasm-bindgen-test = { version = "0.0.1" }
[lib]
name = "lyx-ui-form"
path = "src/lib.rs"
[[example]]
name = "lyx-ui-form"
path = "src/lib.rs"
