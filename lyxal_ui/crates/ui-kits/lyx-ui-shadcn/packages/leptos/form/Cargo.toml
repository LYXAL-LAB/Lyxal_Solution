[package]
name = "lyx-ui-form"
version = "0.8.0"
edition = "2024"
[dependencies]
chrono = { version = "*" }
leptos-style = { version = "*" }
web-sys = { version = "*", features = ["HtmlFormElement", "HtmlInputElement", "HtmlElement", "Element", "Node", "Event", "EventTarget", "SubmitEvent"] }
wasm-bindgen = { version = "*" }
tailwind_fuse = { path = "../../../../../ui-foundations/lyx-found-tailwind/fuse" }
leptos-shadcn-input = { path = "../input" }
leptos-shadcn-button = { path = "../button" }
gloo-timers = { version = "*" }
leptos-struct-component = { version = "*" }
leptos-shadcn-signal-management = { path = "../../signal-management" }
[dev-dependencies]
shadcn-ui-test-utils = { path = "../../test-utils" }
wasm-bindgen-test = { version = "*" }
[lib]
name = "lyx-ui-form"
path = "src/lib.rs"
[[example]]
name = "lyx-ui-form"
path = "src/lib.rs"





