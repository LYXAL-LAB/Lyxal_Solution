[package]
name = "lyx-ui-analytics"
version = "0.8.0"
edition = "2024"
[dependencies]
serde = { version = "*", features = ["derive"] }
serde_json = { version = "*" }
wasm-bindgen = { version = "*" }
web-sys = { version = "*", features = ["Storage", "Window"] }
js-sys = { version = "*" }
gloo-storage = { version = "*" }
[dev-dependencies]
wasm-bindgen-test = { version = "*" }
getrandom = { version = "*" }
[features]
default = []
localStorage = []
memory = []
full = ["localStorage", "memory"]




