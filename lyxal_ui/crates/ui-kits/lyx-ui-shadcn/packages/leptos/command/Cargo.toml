[package]
name = "lyx-ui-command"
version = "0.8.0"
edition = "2024"
[dependencies]
leptos = { path = "../core/lyx-core-leptos/leptos", features = ["csr", "ssr"] }
leptos-style = { version = "*" }
serde = { version = "*", features = ["derive"] }
web-sys = { version = "*" }
leptos-shadcn-signal-management = { path = "../../signal-management" }
[features]
default = ["leptos/csr"]
csr = ["leptos/csr"]
ssr = ["leptos/ssr"]
hydrate = ["leptos/hydrate"]
new_york = []
[dev-dependencies]
shadcn-ui-test-utils = { path = "../../test-utils" }
wasm-bindgen-test = { version = "*" }










