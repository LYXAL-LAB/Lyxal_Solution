[package]
name = "lyx-ui-button"
version = "0.8.0"
edition = "2024"
[dependencies]
leptos-shadcn-signal-management = { path = "../../signal-management" }
# leptos-shadcn-api-standards = { ${2} }
[features]
default = []
new_york = []
[dev-dependencies]
shadcn-ui-test-utils = { path = "../../test-utils" }
wasm-bindgen-test = { version = "*" }
wasm-bindgen-futures = { version = "*" }
js-sys = { version = "*" }
getrandom = { version = "*" }
web-sys = { version = "*", features = ["console", "HtmlElement", "HtmlButtonElement", "Element", "Node", "Document", "Window", "MouseEvent", "KeyboardEvent", "KeyboardEventInit", "TouchEvent", "Event", "EventTarget" ] }






