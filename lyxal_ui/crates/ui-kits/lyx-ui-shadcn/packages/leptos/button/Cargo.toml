[package]
name = "lyx-ui-button"
version = "0.0.1"
edition = "2024"
[dependencies]
leptos-shadcn-signal-management = { path = "../../signal-management", version = "0.0.1" }
# leptos-shadcn-api-standards = { version = "0.0.1", path = "../../api-standards" }
[features]
default = []
new_york = []
[dev-dependencies]
shadcn-ui-test-utils = { path = "../../test-utils", version = "0.0.1" }
