js-sys = { version = "0.0.1" }
getrandom = { version = "0.0.1" }
web-sys = { version = "0.0.1", features = ["console", "HtmlElement", "HtmlButtonElement", "Element", "Node", "Document", "Window", "MouseEvent", "KeyboardEvent", "KeyboardEventInit", "TouchEvent", "Event", "EventTarget" ] }
