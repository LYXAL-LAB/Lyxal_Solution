[package]
name = "lyx-ui-combobox"
version = "0.8.0"
edition = "2024"
[dependencies]
leptos-style = { version = "*" }
web-sys = { version = "*", features = ["HtmlInputElement", "HtmlElement", "Element", "Node", "NodeList", "Event", "EventTarget", "MouseEvent", "KeyboardEvent", "FocusEvent"] }
wasm-bindgen = { version = "*" }
tailwind_fuse = { path = "../../../../../ui-foundations/lyx-found-tailwind/fuse" }
gloo-timers = { version = "*" }
leptos-struct-component = { version = "*" }
leptos-shadcn-signal-management = { path = "../../signal-management" }
[dev-dependencies]
shadcn-ui-test-utils = { path = "../../test-utils" }
wasm-bindgen-test = { version = "*" }
[lib]
name = "lyx-ui-combobox"
path = "src/lib.rs"
[[example]]
name = "lyx-ui-combobox"
path = "src/lib.rs"





