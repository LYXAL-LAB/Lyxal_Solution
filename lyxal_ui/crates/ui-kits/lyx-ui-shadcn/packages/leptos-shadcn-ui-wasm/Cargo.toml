"combobox",
"command",
"context-menu",
"date-picker",
"dialog",
"drawer",
"dropdown-menu",
"error-boundary",
"form",
"hover-card",
"input",
"input-otp",
"label",
"menubar",
"navigation-menu",
"pagination",
"popover",
"progress",
"radio-group",
"resizable",
"scroll-area",
"select",
"separator",
"sheet",
"skeleton",
"slider",
"switch",
"table",
"tabs",
"textarea",
"toast",
"toggle",
"tooltip"
]
# Individual component features
accordion = ["dep:leptos-shadcn-accordion"]
alert = ["dep:leptos-shadcn-alert"]
alert-dialog = ["dep:leptos-shadcn-alert-dialog"]
