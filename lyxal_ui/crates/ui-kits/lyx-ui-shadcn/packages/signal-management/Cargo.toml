[package]
name = "lyx-ui-signal-management"
version = "0.0.1"
edition = "2024"
[dependencies]
lyx-core-leptos = { path = "../../../../core/lyx-core-leptos/leptos", version = "0.0.1" }
serde = { version = "0.0.1", features = ["derive"] }
serde_json = { version = "0.0.1" }
thiserror = { version = "0.0.1" }
js-sys = { version = "0.0.1" }
chrono = { version = "0.0.1", features = ["serde"] }
[dev-dependencies]
lyx-core-leptos = { path = "../../../../core/lyx-core-leptos/leptos", version = "0.0.1", features = ["csr"] }
wasm-bindgen-test = { version = "0.0.1" }
console_error_panic_hook = { version = "0.0.1" }
criterion = { version = "0.0.1", features = ["html_reports"] }
js-sys = { version = "0.0.1" }
