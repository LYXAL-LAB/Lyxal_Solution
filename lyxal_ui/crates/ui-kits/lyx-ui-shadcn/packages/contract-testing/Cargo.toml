[package]
name = "lyx-ui-contract-testing"
version = "0.8.0"
edition = "2024"
[dependencies]
leptos = { path = "../core/lyx-core-leptos/leptos" }
serde = { version = "*", features = ["derive"] }
serde_json = { version = "*" }
thiserror = { version = "*" }
proptest = { version = "*" }
semver = { version = "*" }
anyhow = { version = "*" }
chrono = { version = "*", features = ["serde"] }
# Testing utilities (native only)
# Optional dependencies
wasm-bindgen-test = { optional = true, version = "*" }
web-sys = { optional = true, version = "*", features = ["console"] }
[dev-dependencies]
tempfile = { version = "*" }
[features]
default = ["validation"]
validation = []
wasm-testing = ["dep:wasm-bindgen-test", "dep:web-sys"]
# Conditional dependencies for different targets
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio = { version = "*", features = ["macros", "rt-multi-thread", "time"] }
tokio-test = { version = "*" }
criterion = { version = "*", features = ["html_reports"] }
env_logger = { version = "*" }
[[bin]]
name = "lyx-ui-contract-testing"
path = "src/lib.rs"
