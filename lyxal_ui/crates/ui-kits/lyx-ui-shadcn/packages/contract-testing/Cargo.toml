[package]
name = "lyx-ui-contract-testing"
version = "0.0.1"
edition = "2024"
[dependencies]
lyx-core-leptos = { path = "../../../../core/lyx-core-leptos/leptos", version = "0.0.1" }
serde = { version = "0.0.1", features = ["derive"] }
serde_json = { version = "0.0.1" }
thiserror = { version = "0.0.1" }
proptest = { version = "0.0.1" }
semver = { version = "0.0.1" }
anyhow = { version = "0.0.1" }
chrono = { version = "0.0.1", features = ["serde"] }
# Testing utilities (native only)
# Optional dependencies
wasm-bindgen-test = { optional = true, version = "0.0.1" }
web-sys = { optional = true, version = "0.0.1", features = ["console"] }
[dev-dependencies]
tempfile = { version = "0.0.1" }
[features]
default = ["validation"]
validation = []
wasm-testing = ["dep:wasm-bindgen-test", "dep:web-sys"]
# Conditional dependencies for different targets
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio = { version = "0.0.1", features = ["macros", "rt-multi-thread", "time"] }
tokio-test = { version = "0.0.1" }
criterion = { version = "0.0.1", features = ["html_reports"] }
env_logger = { version = "0.0.1" }
[[bin]]
name = "lyx-ui-contract-testing"
path = "src/lib.rs"
# Benchmarks will be added later
