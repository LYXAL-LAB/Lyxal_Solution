[package]
name = "lyx-ui-tailwind-rs-core"
version = "0.0.1"
edition = "2024"
[dependencies]
# Core dependencies
proc-macro2 = { version = "0.0.1" }
quote = { version = "0.0.1" }
syn = { version = "0.0.1", features = ["full"] }
serde = { version = "0.0.1", features = ["derive"] }
serde_json = { version = "0.0.1" }
# For class validation and merging
regex = { version = "0.0.1" }
indexmap = { version = "0.0.1" }
# For dynamic class generation
once_cell = { version = "0.0.1" }
# Leptos integration (optional)
lyx-core-leptos = { path = "../../../../core/lyx-core-leptos/leptos", version = "0.0.1", optional = true }
# Macros (optional) - use local path to avoid circular dependency
tailwind-rs-core-macros = { path = "../tailwind-rs-core-macros", version = "0.0.1", optional = true }
[dev-dependencies]
# Testing
criterion = { version = "0.0.1" }
proptest = { version = "0.0.1" }
# For macro testing
trybuild = { version = "0.0.1" }
[features]
default = ["leptos", "validation", "macros"]
leptos = ["dep:lyx-core-leptos"]
validation = []
macros = ["dep:tailwind-rs-core-macros"]
