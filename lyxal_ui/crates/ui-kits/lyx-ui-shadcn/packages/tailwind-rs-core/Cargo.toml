[package]
name = "lyx-ui-tailwind-rs-core"
version = "0.8.0"
edition = "2024"
[dependencies]
# Core dependencies
proc-macro2 = { version = "*" }
quote = { version = "*" }
syn = { version = "*", features = ["full"] }
serde = { version = "*", features = ["derive"] }
serde_json = { version = "*" }
# For class validation and merging
regex = { version = "*" }
indexmap = { version = "*" }
# For dynamic class generation
once_cell = { version = "*" }
# Leptos integration (optional)
leptos = { path = "../core/lyx-core-leptos/leptos", optional = true }
# Macros (optional) - use local path to avoid circular dependency
tailwind-rs-core-macros = { path = "../tailwind-rs-core-macros", optional = true }
[dev-dependencies]
# Testing
criterion = { version = "*" }
proptest = { version = "*" }
# For macro testing
trybuild = { version = "*" }
[features]
default = ["leptos", "validation", "macros"]
leptos = ["dep:leptos"]
validation = []
macros = ["dep:tailwind-rs-core-macros"]










