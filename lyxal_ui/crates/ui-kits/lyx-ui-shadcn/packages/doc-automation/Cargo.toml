[package]
name = "lyx-ui-doc-automation"
version = "0.8.0"
edition = "2024"
[dependencies]
# Core dependencies
tokio = { version = "*", features = ["full"] }
serde = { version = "*", features = ["derive"] }
serde_json = { version = "*" }
anyhow = { version = "*" }
thiserror = { version = "*" }
# File system operations
walkdir = { version = "*" }
# Template processing
handlebars = { version = "*" }
pulldown-cmark = { version = "*" }
# Code parsing
syn = { version = "*", features = ["full", "extra-traits"] }
quote = { version = "*" }
# HTML generation
html-escape = { version = "*" }
# Time handling
chrono = { version = "*", features = ["serde"] }
# Logging
log = { version = "*" }
[dev-dependencies]
tempfile = { version = "*" }
tokio-test = { version = "*" }
pretty_assertions = { version = "*" }
[features]
default = ["gallery", "api-docs"]
gallery = []
api-docs = []
testing = []
[[bin]]
name = "lyx-ui-doc-automation"
path = "src/lib.rs"




