[package]
name = "lyx-ui-doc-automation"
version = "0.0.1"
edition = "2024"
[dependencies]
# Core dependencies
tokio = { version = "0.0.1", features = ["full"] }
serde = { version = "0.0.1", features = ["derive"] }
serde_json = { version = "0.0.1" }
anyhow = { version = "0.0.1" }
thiserror = { version = "0.0.1" }
# File system operations
walkdir = { version = "0.0.1" }
# Template processing
handlebars = { version = "0.0.1" }
pulldown-cmark = { version = "0.0.1" }
# Code parsing
syn = { version = "0.0.1", features = ["full", "extra-traits"] }
quote = { version = "0.0.1" }
# HTML generation
html-escape = { version = "0.0.1" }
# Time handling
chrono = { version = "0.0.1", features = ["serde"] }
# Logging
log = { version = "0.0.1" }
[dev-dependencies]
tempfile = { version = "0.0.1" }
tokio-test = { version = "0.0.1" }
pretty_assertions = { version = "0.0.1" }
[features]
default = ["gallery", "api-docs"]
gallery = []
api-docs = []
testing = []
[[bin]]
name = "lyx-ui-doc-automation"
path = "src/lib.rs"
