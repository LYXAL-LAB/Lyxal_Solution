[package]
name = "lyx-spec-toast"
version = "0.0.1"
edition = "2024"

[dependencies]
js-sys = { version = "0.0.1" }
lyx-core-leptos = { path = "../../core/lyx-core-leptos/leptos", version = "0.0.1" }
lyx-core-meta = { path = "../../core/lyx-core-leptos/meta", version = "0.0.1", optional = true }
wasm-bindgen = { version = "0.0.1" }
web-sys = { version = "0.0.1", features = ["EventTarget", "HtmlElement", "DomRect", "Element" ] }
cfg-if = { version = "0.0.1" }

[features]
# Enables the built-in <Toast /> component
builtin_toast = []
csr = ["lyx-core-leptos/csr"]
ssr = ["dep:lyx-core-meta", "lyx-core-leptos/ssr", "lyx-core-meta/ssr"]
hydrate = ["lyx-core-leptos/hydrate"]
