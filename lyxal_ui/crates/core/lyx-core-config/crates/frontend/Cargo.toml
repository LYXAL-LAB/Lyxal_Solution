[package]
name = "frontend"
version = "0.0.1"
edition = "2024"

[dependencies]
leptos = { version = "0.0.1", path = "../../../lyx-core-leptos/leptos", optional = false, features = ["csr"] }
leptos_router = { version = "0.0.1", path = "../../../lyx-core-leptos/router", optional = false }
serde = { version = "0.0.1", features = ["derive"] }
serde_json = "1"
gloo-net = "0.5"
wasm-bindgen = "0.2"
web-sys = { version = "0.0.1", features = ["Window", "Document", "HtmlElement"] }
console_error_panic_hook = "0.1"
