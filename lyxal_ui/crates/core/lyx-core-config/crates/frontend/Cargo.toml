[package]
name = "frontend"
version = "0.8.0"
edition = "2024"

[dependencies]
leptos = { ${2}, optional = false, features = ["csr"] }
leptos_router = { ${2}, optional = false }
serde = { version = "*", features = ["derive"] }
serde_json = "1"
gloo-net = "0.5"
wasm-bindgen = "0.2"
web-sys = { version = "*", features = ["Window", "Document", "HtmlElement"] }
console_error_panic_hook = "0.1"









