[package]
name = "lyx-core-context_aware_config"
version = "0.0.1"
edition = "2024"

[dependencies]
actix-http = { version = "0.0.1" }
actix-web = { version = "0.0.1" }
anyhow = { version = "0.0.1" }
bigdecimal = { version = "0.0.1" }
blake3 = { version = "0.0.1" }
lyx-core-cac_client = { path = "../cac_client", version = "0.0.1" }
chrono = { version = "0.0.1" }
diesel = { version = "0.0.1", features = ["numeric"] }
fred = { version = "0.0.1", optional = true, features = ["metrics"] }
itertools = { version = "0.0.1" }
jsonlogic = { version = "0.0.1" }
jsonschema = { version = "0.0.1" }
log = { version = "0.0.1" }
num-bigint = { version = "0.0.1" }
serde = { version = "0.0.1" }
serde_json = { version = "0.0.1" }
secrecy = { version = "0.0.1" }
lyx-core-service_utils = { path = "../service_utils", version = "0.0.1" }
lyx-core-superposition_derives = { path = "../superposition_derives", version = "0.0.1" }
lyx-core-superposition_macros = { path = "../superposition_macros", version = "0.0.1" }
lyx-core-superposition_types = { path = "../superposition_types", version = "0.0.1", features = ["api", "result", "diesel_derives", "server" ], optional = true }
uuid = { version = "0.0.1" }

[features]
disable_db_data_validation = ["lyx-core-superposition_types/disable_db_data_validation"]
high-performance-mode = ["dep:fred"]
