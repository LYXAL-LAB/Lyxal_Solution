[package]
name = "lyx-core-router_macro"
version = "0.0.1"
edition = "2024"
[lib]
proc-macro = true
[dependencies]
proc-macro-error2 = { version = "0.0.1", default-features = false }
proc-macro2 = { version = "0.0.1", default-features = true }
quote = { version = "0.0.1", default-features = true }
syn = { version = "0.0.1", features = ["full"], default-features = true }
[dev-dependencies]
lyx-core-leptos = { path = "../leptos", version = "0.0.1" }
lyx-core-router = { path = "../router", version = "0.0.1" }
lyx-core-leptos_macro = { path = "../leptos_macro", version = "0.0.1" }
