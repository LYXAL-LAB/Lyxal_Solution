[package]
name = "lyx-core-meta"
version = "0.0.1"
edition = "2024"

[dependencies]
lyx-core-leptos = { path = "../leptos", version = "0.0.1", optional = true }
lyx-core-or_poisoned = { path = "../or_poisoned", version = "0.0.1" }
indexmap = { version = "0.0.1" }
send_wrapper = { version = "0.0.1" }
tracing = { version = "0.0.1", optional = true }
wasm-bindgen = { version = "0.0.1" }
futures = { version = "0.0.1" }
web-sys = { version = "0.0.1", features = ["HtmlLinkElement", "HtmlMetaElement", "HtmlTitleElement"], optional = true }

[features]
nonce = []
nightly = []
hydrate = []
ssr = []
csr = []
