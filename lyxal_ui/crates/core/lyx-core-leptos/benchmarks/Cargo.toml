[package]
name = "benchmarks"
version = "*"
edition = "2024"

[dependencies]
leptos = { path = "../leptos", version = "*", features = ["ssr", "nightly"] }
leptos_reactive = { path = "../reactive_graph" }
tachydom = { path = "../tachys" }
# tachy_maccy = { path = "../tachy_maccy" }
sycamore = { version = "*", features = ["ssr"] }
yew = { version = "*", features = ["ssr"] }
tokio-test = "0.4"
miniserde = "0.1"
gloo = "0.11"
uuid = { version = "*", features = ["serde", "v4", "wasm-bindgen"] }
wasm-bindgen = "0.2"
lazy_static = "1.4"
log = "0.4"
strum = "0.26"
strum_macros = "0.26"
serde = { version = "*", features = ["derive", "rc"] }
serde_json = "1"
tera = "1"
web-sys = { version = "*", features = ["Window", "Document", "HtmlElement", "HtmlInputElement"] }


[build-dependencies]
rustc_version = "*"


