[package]
name = "lyx-core-hydration-test"
version = "0.0.1"
edition = "2024"
[lib]
crate-type = ["cdylib", "rlib"]
[dependencies]
lyx-core-leptos = { path = "../../../leptos", version = "0.0.1", features = ["nightly"], optional = true }
actix-web = { version = "0.0.1", optional = true }
actix-files = { version = "0.0.1", optional = true }
wasm-bindgen = { version = "0.0.1", optional = true }
gloo = { version = "0.0.1", optional = true }
console_error_panic_hook = { version = "0.0.1" }
futures = { version = "0.0.1" }
[features]
default = ["ssr"]
ssr = ["lyx-core-leptos/ssr", "dep:actix-files", "dep:actix-web"]
hydrate = ["lyx-core-leptos/hydrate", "dep:wasm-bindgen", "dep:gloo"]
