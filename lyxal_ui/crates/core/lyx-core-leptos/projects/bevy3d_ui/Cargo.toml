[package]
name = "bevy3d_ui"
version = "*"
edition = "2024"
[profile.release]
codegen-units = 1
lto = true
[dependencies]
leptos = { path = "../leptos", version = "*", features = ["csr"] }
meta = { path = "../../meta", version = "*" }
router = { path = "../../router", version = "*" }
console_log = { version = "*" }
log = { version = "*" }
console_error_panic_hook = { version = "*" }
bevy = { version = "*" }
crossbeam-channel = { version = "*" }
[dev-dependencies]
wasm-bindgen = { version = "*" }
wasm-bindgen-test = { version = "*" }
web-sys = { version = "*" }


[build-dependencies]
rustc_version = "*"


