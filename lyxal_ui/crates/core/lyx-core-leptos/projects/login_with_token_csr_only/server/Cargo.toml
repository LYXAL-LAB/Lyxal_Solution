[package]
name = "server"
version = "0.8.0"
edition = "2024"
[dependencies]
api-boundary = { version = "0.8.0", path = "../api-boundary", optional = false }
anyhow = { version = "*" }
axum = { version = "*" }
axum-extra = { version = "*", features = ["typed-header"] }
env_logger = { version = "*" }
log = { version = "*" }
mailparse = { version = "*" }
pwhash = { version = "*" }
thiserror = { version = "*" }
tokio = { version = "*", features = ["macros", "rt-multi-thread"] }
tower-http = { version = "*", features = ["cors"] }
uuid = { version = "*", features = ["v4"] }
parking_lot = { version = "*" }
headers = { version = "*" }


[build-dependencies]
rustc_version = "*"




