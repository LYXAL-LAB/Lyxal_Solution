[package]
name = "meilisearch-searchbar"
version = "0.8.0"
edition = "2024"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
leptos = { path = "../leptos", version = "0.8.0" }
serde = { version = "*", features = ["derive"] }
serde_json = "1"
wasm-bindgen = "0.2"
web-sys = { version = "*", features = ["HtmlInputElement", "HtmlElement", "Window"] }
simple_logger = { version = "*", optional = true }

[features]
default = []
ssr = ["leptos/ssr", "dep:simple_logger"]
hydrate = ["leptos/hydrate"]


[build-dependencies]
rustc_version = "*"





