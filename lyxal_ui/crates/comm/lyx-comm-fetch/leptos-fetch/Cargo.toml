[package]
name = "lyx-comm-leptos-fetch"
version = "0.0.1"
edition = "2024"

[dependencies]
lyx-core-leptos = { path = "../../../core/lyx-core-leptos/leptos", version = "0.0.1" }
serde = { version = "0.0.1", features = ["derive"] }
wasm-bindgen = { version = "0.0.1" }
js-sys = { version = "0.0.1" }
web-sys = { version = "0.0.1", features = ["Window", "Response", "Request", "RequestInit", "RequestMode", "Headers"] }
