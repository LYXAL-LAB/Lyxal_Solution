[package]
name = "lyx-ui-foundations-example"
version = "0.0.1"
edition = "2024"

[dependencies]
lyx-core-leptos = { path = "../../../core/lyx-core-leptos/leptos", version = "0.0.1", features = ["nightly"] }
lyx-core-router = { path = "../../../core/lyx-core-leptos/router", version = "0.0.1", features = ["nightly", "csr"] }
wasm-bindgen = { version = "0.0.1" }
web-sys = { version = "0.0.1", features = ["CanvasRenderingContext2d"] }
lyx-found-animation = { path = "../", version = "0.0.1" }
palette = { version = "0.0.1" }
derive_more = { version = "0.0.1" }
