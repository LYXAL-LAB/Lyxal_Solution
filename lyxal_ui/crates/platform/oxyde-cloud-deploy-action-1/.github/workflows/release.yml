name: Release
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release"
        required: true
jobs:
  build-artifacts:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
    #          - target: x86_64-apple-darwin
    #            os: macos-latest
    #          - target: x86_64-pc-windows-msvc
    #            os: windows-latest
    #            file_extension: .exe
    runs-on: ${{ matrix.os }}
    name: ${{ matrix.target }}
    env:
      binary_name: oxyde-cloud-deploy-action${{ matrix.file_extension }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy, rust-src

      - name: Install host target
        run: rustup target add ${{ matrix.target }}

      - name: Install musl-tools and cargo-zigbuild
        if: ${{ matrix.target == 'x86_64-unknown-linux-musl' }}
        run: |
          sudo apt-get install -y musl-tools build-essential && sudo ln -s /bin/g++ /bin/musl-g++
          pip install cargo-zigbuild

      - name: Build with Zig
        if: ${{ matrix.target == 'x86_64-unknown-linux-musl' }}
        run: cargo zigbuild --release --target ${{ matrix.target }}

      - name: Build
        if: ${{ matrix.target != 'x86_64-unknown-linux-musl' }}
        run: cargo build --release --target ${{ matrix.target }}

      - name: Create Archive Folder
        run: mkdir -p ${{ runner.os }}
      - name: Copy Artifact

        run: cp target/${{ matrix.target }}/release/${{ env.binary_name }} ${{ runner.os }}
      - name: Create Tar Archive

        run: tar -czf ${{ runner.os }}.tgz ${{ runner.os }}
      - name: Store Archive

        uses: actions/upload-artifact@v4
        with:
          name: ${{runner.os}}
          path: ${{ runner.os }}.tgz

  create-release:
    needs: [build-artifacts]
    runs-on: ubuntu-latest
    name: Create Release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
      - name: Create Release
        uses: ncipollo/release-action@v1
        with:
          artifacts: "Linux/Linux.tgz,macOS/macOS.tgz,Windows/Windows.tgz"
          tag: v${{ github.event.inputs.version }}
