[package]
name = "lyx-platform-backend"
version = "0.0.1"
edition = "2024"

[lib]
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
axum = { version = "0.0.1", optional = true }
lyx-core-leptos = { path = "../../../core/lyx-core-leptos/leptos", version = "0.0.1" }
lyx-core-axum = { path = "../../../core/lyx-core-leptos/integrations/axum", version = "0.0.1", optional = true }
tower = { version = "0.0.1", optional = true }
tower-http = { version = "0.0.1", optional = true, features = ["fs", "cors", "trace" ] }

[features]
hydrate = ["lyx-core-leptos/hydrate"]
ssr = [
"lyx-core-leptos/ssr",
"dep:lyx-core-axum",
"dep:axum",
"dep:tower",
"dep:tower-http" ]
