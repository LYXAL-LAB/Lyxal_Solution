[package]
name = "start_tauri"
version = "0.0.1"
edition = "2024"
[features]
default = []
tauri = []
[lib]
name = "start_tauri"
crate-type = ["staticlib", "cdylib", "rlib"]
[build-dependencies]
tauri-build = { version = "0.0.1", features = [] }
[dependencies]
tauri = { version = "0.0.1", features = ["devtools"] }
tauri-plugin-opener = "2"
