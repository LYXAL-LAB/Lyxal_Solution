[package]
name = "lyxal_network-memory-connection-limits"
edition.workspace = true
rust-version = { workspace = true }
version = "0.5.0"

[dependencies]
memory-stats = { version = "1", features = ["always_use_statm"] }
lyxal_network-core = { workspace = true }
lyxal_network-swarm = { workspace = true }
lyxal_network-identity = { workspace = true, features = ["peerid"] }
sysinfo = "0.33"
tracing = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "time"] }
lyxal_network-identify = { workspace = true }
lyxal_network-swarm-derive = { path = "../../swarm-derive" }
lyxal_network-swarm-test = { path = "../../swarm-test" }

[lints]
workspace = true
