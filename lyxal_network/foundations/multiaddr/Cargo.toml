[package]
description = "Implementation of the multiaddr format"
edition = "2024"
name = "lyxal_network-multiaddr"
version.workspace = true

[features]
default = ["url"]

[dependencies]
arrayref = "0.3"
byteorder = "1.5.0"
bytes = "1.7.2"
data-encoding = "2.6.0"
multibase = { path = "../../../lyxal_parser/multibase", version = "0.9.2" }
multihash = "0.19"
percent-encoding = "2.3.1"
serde = "1.0.209"
static_assertions = "1.1"
unsigned-varint = "0.8"
url = { version = "2.5.0", optional = true, default-features = false }
lyxal_network-identity = { workspace = true, features = ["peerid"] }

[dev-dependencies]
multiaddr = { package = "lyxal_network-multiaddr", path = "." }
bincode = "1"
quickcheck = { version = "1.0.3", default-features = false }
rand = "0.9.0"
serde_json = "1.0"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(nightly)'] }
