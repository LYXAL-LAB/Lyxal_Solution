[package]
name = "lyxal_network-mplex"
edition.workspace = true
rust-version = { workspace = true }
version = "0.43.1"

[dependencies]
bytes = "1"
futures = { workspace = true }
asynchronous-codec = { workspace = true }
lyxal_network-core = { workspace = true }
lyxal_network-identity = { workspace = true }
nohash-hasher = "0.2"
parking_lot = "0.12"
rand = "0.8"
smallvec = "1.13.2"
tracing = { workspace = true }
unsigned-varint = { workspace = true, features = ["asynchronous_codec"] }

[dev-dependencies]
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "macros"] }
criterion = "0.5"
futures = { workspace = true }
lyxal_network-identity = { workspace = true, features = ["rand"] }
lyxal_network-muxer-test-harness = { path = "../test-harness" }
lyxal_network-plaintext = { workspace = true }
lyxal_network-tcp = { workspace = true, features = ["tokio"] }
quickcheck = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter"] }

[[bench]]
name = "split_send_size"
harness = false

# Passing arguments to the docsrs builder in order to properly document cfg's.
# More information: https://docs.rs/about/builds#cross-compiling
[package.metadata.docs.rs]
all-features = true

[lints]
workspace = true
