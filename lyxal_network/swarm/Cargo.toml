[package]
name = "lyxal_network-swarm"
edition.workspace = true
rust-version = { workspace = true }
description = "The lyxal_network swarm"
version = "0.47.1"

[dependencies]
either = "1.11.0"
fnv = "1.0"
futures = { workspace = true }
futures-timer = "3.0.3"
getrandom = { workspace = true, features = ["js"], optional = true } # Explicit dependency to be used in `wasm-bindgen` feature
web-time = { workspace = true }
hashlink = { workspace = true }
lyxal_network-core = { workspace = true }
lyxal_network-identity = { workspace = true }
lyxal_network-swarm-derive = { workspace = true, optional = true }
multistream-select = { workspace = true }
rand = "0.8"
smallvec = "1.13.2"
tracing = { workspace = true }
wasm-bindgen-futures = { version = "0.4.42", optional = true }

[target.'cfg(not(any(target_os = "emscripten", target_os = "wasi", target_os = "unknown")))'.dependencies]
tokio = { workspace = true, features = ["rt"], optional = true }

[features]
macros = ["dep:lyxal_network-swarm-derive"]
tokio = ["dep:tokio"]
wasm-bindgen = ["dep:wasm-bindgen-futures", "dep:getrandom"]

[dev-dependencies]
either = "1.11.0"
futures = { workspace = true }
lyxal_network-identify = { path = "../protocols/identify" }                # Using `path` here because this is a cyclic dev-dependency which otherwise breaks releasing.
lyxal_network-identity = { workspace = true, features = ["ed25519"] }
lyxal_network-kad = { path = "../protocols/kad" }                          # Using `path` here because this is a cyclic dev-dependency which otherwise breaks releasing.
lyxal_network-ping = { path = "../protocols/ping" }                        # Using `path` here because this is a cyclic dev-dependency which otherwise breaks releasing.
lyxal_network-plaintext = { path = "../transports/plaintext" }             # Using `path` here because this is a cyclic dev-dependency which otherwise breaks releasing.
lyxal_network-swarm-derive = { path = "../swarm-derive" }                  # Using `path` here because this is a cyclic dev-dependency which otherwise breaks releasing.
lyxal_network-swarm-test = { path = "../swarm-test", features = ["tokio"] }# Using `path` here because this is a cyclic dev-dependency which otherwise breaks releasing.
lyxal_network-yamux = { path = "../muxers/yamux" }                         # Using `path` here because this is a cyclic dev-dependency which otherwise breaks releasing.
quickcheck = { workspace = true }
criterion = { version = "0.5", features = ["async_tokio"] }
trybuild = "1.0.95"
tokio = { workspace = true, features = ["time", "rt", "macros", "rt-multi-thread"] }
tracing-subscriber = { workspace = true, features = ["env-filter"] }

[[test]]
name = "swarm_derive"
required-features = ["macros"]

# Passing arguments to the docsrs builder in order to properly document cfg's.
# More information: https://docs.rs/about/builds#cross-compiling
[package.metadata.docs.rs]
all-features = true

[[bench]]
name = "connection_handler"
harness = false

[lints]
workspace = true
