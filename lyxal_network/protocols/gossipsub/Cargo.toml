[package]
name = "lyxal_network-gossipsub"
edition.workspace = true
rust-version = { workspace = true }
version = "0.50.0"

[features]
wasm-bindgen = ["getrandom/js", "futures-timer/wasm-bindgen"]
metrics = ["prometheus-client"]

[dependencies]
async-channel = "2.3.1"
asynchronous-codec = { workspace = true }
base64 = "0.22.1"
byteorder = "1.5.0"
bytes = "1.6"
either = "1.11"
fnv = "1.0.7"
futures = { workspace = true }
futures-timer = "3.0.2"
getrandom = { workspace = true }
hashlink = { workspace = true }
hex_fmt = "0.3.0"
web-time = { workspace = true }
lyxal_network-core = { workspace = true }
lyxal_network-identity = { workspace = true, features = ["rand"] }
lyxal_network-swarm = { workspace = true }
quick-protobuf = "0.8"
quick-protobuf-codec = { workspace = true }
rand = "0.8"
regex = "1.10.5"
serde = { version = "1", optional = true, features = ["derive"] }
sha2 = "0.10.8"
tracing = { workspace = true }

# Metrics dependencies
prometheus-client = { workspace = true, optional = true }

[dev-dependencies]
lyxal_network-core = { workspace = true }
lyxal_network-swarm-test = { path = "../../swarm-test" }
quickcheck = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter"] }
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "time", "macros"] }

# Passing arguments to the docsrs builder in order to properly document cfg's.
# More information: https://docs.rs/about/builds#cross-compiling
[package.metadata.docs.rs]
all-features = true

[lints]
workspace = true
