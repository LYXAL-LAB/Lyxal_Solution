[package]
name = "lyxal_network-relay"
edition.workspace = true
rust-version = { workspace = true }
description = "Communications relaying for lyxal_network"
version = "0.21.1"

[dependencies]
asynchronous-codec = { workspace = true }
bytes = "1"
either = "1.12.0"
futures = { workspace = true }
futures-timer = "3"
futures-bounded = { workspace = true }
web-time = { workspace = true }
lyxal_network-core = { workspace = true }
lyxal_network-swarm = { workspace = true }
lyxal_network-identity = { workspace = true }
quick-protobuf = "0.8"
quick-protobuf-codec = { workspace = true }
rand = "0.8.4"
static_assertions = "1"
thiserror = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
lyxal_network-identity = { workspace = true, features = ["rand"] }
lyxal_network-ping = { workspace = true }
lyxal_network-plaintext = { workspace = true }
lyxal_network-swarm = { workspace = true, features = ["macros", "tokio"] }
lyxal_network-swarm-test = { workspace = true }
lyxal_network-yamux = { workspace = true }
quickcheck = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter"] }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }


# Passing arguments to the docsrs builder in order to properly document cfg's.
# More information: https://docs.rs/about/builds#cross-compiling
[package.metadata.docs.rs]
all-features = true

[lints]
workspace = true
