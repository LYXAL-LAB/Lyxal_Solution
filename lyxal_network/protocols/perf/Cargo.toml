[package]
name = "lyxal_network-perf"
edition.workspace = true
rust-version = { workspace = true }
description = "lyxal_network perf protocol implementation"
version = "0.4.0"

[dependencies]
anyhow = "1"
clap = { version = "4.5.6", features = ["derive"] }
futures = { workspace = true }
futures-bounded = { workspace = true }
futures-timer = "3.0"
web-time = { workspace = true }
lyxal_network = { workspace = true, features = ["tokio", "tcp", "quic", "tls", "yamux", "dns"] }
lyxal_network-core = { workspace = true }
lyxal_network-identity = { workspace = true, features = ["rand"] }
lyxal_network-swarm = { workspace = true, features = ["macros", "tokio"] }
lyxal_network-tcp = { workspace = true, features = ["tokio"] }
lyxal_network-tls = { workspace = true }
lyxal_network-yamux = { workspace = true }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter"] }
tokio = { workspace = true, features = ["macros", "rt", "rt-multi-thread"] }

[dev-dependencies]
lyxal_network-swarm-test = { path = "../../swarm-test" }

# Passing arguments to the docsrs builder in order to properly document cfg's.
# More information: https://docs.rs/about/builds#cross-compiling
[package.metadata.docs.rs]
all-features = true

[lints]
workspace = true
