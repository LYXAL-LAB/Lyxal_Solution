[package]
name = "lyxal_network-mdns"
edition.workspace = true
rust-version = { workspace = true }
version = "0.48.0"
description = "Implementation of the lyxal_network mDNS discovery method"

[dependencies]
futures = { workspace = true }
if-watch = { workspace = true }
lyxal_network-core = { workspace = true }
lyxal_network-swarm = { workspace = true }
lyxal_network-identity = { workspace = true }
rand = "0.8.3"
smallvec = "1.13.2"
socket2 = { version = "0.6.0", features = ["all"] }
tokio = { workspace = true, default-features = false, features = ["net", "time"], optional = true }
tracing = { workspace = true }
hickory-proto = { workspace = true, features = ["mdns"] }

[features]
tokio = ["dep:tokio", "if-watch/tokio"]

[dev-dependencies]
lyxal_network-swarm = { workspace = true, features = ["tokio"] }
tokio = { workspace = true, features = ["macros", "rt", "rt-multi-thread", "time"] }
lyxal_network-swarm-test = { path = "../../swarm-test" }
tracing-subscriber = { workspace = true, features = ["env-filter"] }

[[test]]
name = "use-tokio"
required-features = ["tokio", "lyxal_network-swarm-test/tokio"]


# Passing arguments to the docsrs builder in order to properly document cfg's.
# More information: https://docs.rs/about/builds#cross-compiling
[package.metadata.docs.rs]
all-features = true

[lints]
workspace = true
