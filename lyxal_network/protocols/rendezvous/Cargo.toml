[package]
name = "lyxal_network-rendezvous"
edition.workspace = true
rust-version = { workspace = true }
description = "Rendezvous protocol for lyxal_network"
version = "0.17.0"

[dependencies]
asynchronous-codec = { workspace = true }
async-trait = "0.1"
bimap = "0.6.3"
futures = { workspace = true, features = ["std"] }
futures-timer = "3.0.3"
web-time = { workspace = true }
lyxal_network-core = { workspace = true }
lyxal_network-swarm = { workspace = true }
lyxal_network-identity = { workspace = true }
lyxal_network-request-response = { workspace = true }
quick-protobuf = "0.8"
quick-protobuf-codec = { workspace = true }
rand = "0.8"
thiserror = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
lyxal_network-swarm = { workspace = true, features = ["macros", "tokio"] }
lyxal_network-swarm-test = { path = "../../swarm-test" }
rand = "0.8"
tokio = { workspace = true, features = [ "rt-multi-thread", "time", "macros", "sync", "process", "fs", "net" ] }
tracing-subscriber = { workspace = true, features = ["env-filter"] }

# Passing arguments to the docsrs builder in order to properly document cfg's.
# More information: https://docs.rs/about/builds#cross-compiling
[package.metadata.docs.rs]
all-features = true

[lints]
workspace = true
