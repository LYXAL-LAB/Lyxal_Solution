[package]
name = "lyxal_network-autonat"
edition.workspace = true
rust-version = { workspace = true }
description = "NAT and firewall detection for lyxal_network"
version = "0.15.0"


[dependencies]
async-trait = { version = "0.1", optional = true }
asynchronous-codec = { workspace = true }
either = { version = "1.9.0", optional = true }
futures = { workspace = true }
futures-bounded = { workspace = true, optional = true }
futures-timer = "3.0"
web-time = { workspace = true, optional = true }
lyxal_network-core = { workspace = true }
lyxal_network-identity = { workspace = true }
lyxal_network-request-response = { workspace = true, optional = true }
lyxal_network-swarm = { workspace = true }
quick-protobuf = "0.8"
tracing = { workspace = true }
quick-protobuf-codec = { workspace = true }
rand = "0.8"
rand_core = { version = "0.6", optional = true }
thiserror = { workspace = true, optional = true }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt", "sync"] }
lyxal_network-swarm-test = { path = "../../swarm-test" }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
lyxal_network-identify = { workspace = true }
lyxal_network-swarm = { workspace = true, features = ["macros"] }

[features]
default = ["v1", "v2"]
v1 = ["dep:lyxal_network-request-response", "dep:web-time", "dep:async-trait"]
v2 = ["dep:either", "dep:futures-bounded", "dep:thiserror", "dep:rand_core"]

# Passing arguments to the docsrs builder in order to properly document cfg's.
# More information: https://docs.rs/about/builds#cross-compiling
[package.metadata.docs.rs]
all-features = true

[lints]
workspace = true
