[package]
name = "lyxal_network-identify"
edition.workspace = true
rust-version = { workspace = true }
description = "Nodes identification protocol for lyxal_network"
version = "0.47.0"

[dependencies]
asynchronous-codec = { workspace = true }
futures = { workspace = true }
futures-timer = "3.0.3"
futures-bounded = { workspace = true }
lyxal_network-core = { workspace = true }
lyxal_network-swarm = { workspace = true }
lyxal_network-identity = { workspace = true }
quick-protobuf-codec = { workspace = true }
quick-protobuf = "0.8"
smallvec = "1.13.2"
thiserror = { workspace = true }
tracing = { workspace = true }
either = "1.12.0"

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
lyxal_network-swarm-test = { path = "../../swarm-test" }
lyxal_network-swarm = { workspace = true, features = ["macros"] }
tracing-subscriber = { workspace = true, features = ["env-filter"] }

# Passing arguments to the docsrs builder in order to properly document cfg's.
# More information: https://docs.rs/about/builds#cross-compiling
[package.metadata.docs.rs]
all-features = true

[lints]
workspace = true
