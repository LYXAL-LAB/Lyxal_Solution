[package]
name = "lyxal_network-kad"
edition.workspace = true
rust-version = { workspace = true }
description = "Kademlia protocol for lyxal_network"
version = "0.49.0"

[dependencies]
bytes = "1"
either = "1.11"
fnv = "1.0"
asynchronous-codec = { workspace = true }
futures = { workspace = true }
lyxal_network-core = { workspace = true }
lyxal_network-swarm = { workspace = true }
futures-bounded = { workspace = true }
quick-protobuf = "0.8"
quick-protobuf-codec = { workspace = true }
lyxal_network-identity = { workspace = true, features = ["rand"] }
rand = "0.8"
sha2 = "0.10.8"
smallvec = "1.13.2"
uint = "0.10"
futures-timer = "3.0.3"
web-time = { workspace = true }
serde = { version = "1.0", optional = true, features = ["derive"] }
thiserror = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time"] }
futures-timer = "3.0"
lyxal_network-identify = { path = "../identify" }
lyxal_network-noise = { workspace = true }
lyxal_network-swarm = { path = "../../swarm", features = ["macros", "tokio"] }
lyxal_network-swarm-test = { path = "../../swarm-test" }
lyxal_network-yamux = { workspace = true }
quickcheck = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter"] }

[features]
serde = ["dep:serde", "bytes/serde"]

# Passing arguments to the docsrs builder in order to properly document cfg's.
# More information: https://docs.rs/about/builds#cross-compiling
[package.metadata.docs.rs]
all-features = true

[lints]
workspace = true
