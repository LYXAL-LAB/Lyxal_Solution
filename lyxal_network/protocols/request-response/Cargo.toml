[package]
name = "lyxal_network-request-response"
edition.workspace = true
rust-version = { workspace = true }
description = "Generic Request/Response Protocols"
version = "0.29.0"

[dependencies]
async-trait = "0.1"
cbor4ii = { version = "0.3.2", features = ["serde1", "use_std"], optional = true }
futures = { workspace = true }
lyxal_network-core = { workspace = true }
lyxal_network-swarm = { workspace = true }
lyxal_network-identity = { workspace = true }
rand = "0.8"
serde = { version = "1.0", optional = true }
serde_json = { version = "1.0.117", optional = true }
smallvec = "1.13.2"
tracing = { workspace = true }
futures-bounded = { workspace = true }

[features]
json = ["dep:serde", "dep:serde_json", "lyxal_network-swarm/macros"]
cbor = ["dep:serde", "dep:cbor4ii", "lyxal_network-swarm/macros"]

[dev-dependencies]
anyhow = "1.0.86"
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time"] }
rand = "0.8"
lyxal_network-swarm-test = { path = "../../swarm-test" }
futures_ringbuf = "0.4.0"
serde = { version = "1.0", features = ["derive"] }
tracing-subscriber = { workspace = true, features = ["env-filter"] }

# Passing arguments to the docsrs builder in order to properly document cfg's.
# More information: https://docs.rs/about/builds#cross-compiling
[package.metadata.docs.rs]
all-features = true

[lints]
workspace = true
