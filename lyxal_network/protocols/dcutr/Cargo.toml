[package]
name = "lyxal_network-dcutr"
edition.workspace = true
rust-version = { workspace = true }
description = "Direct connection upgrade through relay"
version = "0.14.1"

[dependencies]
asynchronous-codec = { workspace = true }
either = "1.11.0"
futures = { workspace = true }
futures-timer = "3.0"
web-time = { workspace = true }
lyxal_network-core = { workspace = true }
lyxal_network-swarm = { workspace = true }
lyxal_network-identity = { workspace = true }
quick-protobuf = "0.8"
quick-protobuf-codec = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
hashlink = { workspace = true }
futures-bounded = { workspace = true }

[dev-dependencies]
lyxal_network-identify = { workspace = true }
lyxal_network-plaintext = { workspace = true }
lyxal_network-relay = { workspace = true }
lyxal_network-swarm = { workspace = true, features = ["macros"] }
lyxal_network-swarm-test = { path = "../../swarm-test" }
lyxal_network-tcp = { workspace = true, features = ["tokio"] }
lyxal_network-yamux = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter"] }
tokio = { workspace = true, features = ["rt", "macros"] }

# Passing arguments to the docsrs builder in order to properly document cfg's.
# More information: https://docs.rs/about/builds#cross-compiling
[package.metadata.docs.rs]
all-features = true

[lints]
workspace = true
