[package]
name = "lyxal_network-ping"
edition.workspace = true
rust-version = { workspace = true }
description = "Ping protocol for lyxal_network"
version = "0.47.0"

[dependencies]
futures = { workspace = true }
futures-timer = "3.0.3"
web-time = { workspace = true }
lyxal_network-core = { workspace = true }
lyxal_network-swarm = { workspace = true }
lyxal_network-identity = { workspace = true }
rand = "0.8"
tracing = { workspace = true }

[dev-dependencies]
lyxal_network-swarm = { workspace = true, features = ["macros"] }
lyxal_network-swarm-test = { path = "../../swarm-test" }
quickcheck = { workspace = true }
tokio = {workspace = true, features = ["rt", "macros"]}

# Passing arguments to the docsrs builder in order to properly document cfg's.
# More information: https://docs.rs/about/builds#cross-compiling
[package.metadata.docs.rs]
all-features = true

[lints]
workspace = true
