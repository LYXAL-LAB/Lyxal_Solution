[package]
name = "lyxal_network-webtransport-websys"
edition.workspace = true
rust-version = { workspace = true }
description = "WebTransport for lyxal_network under WASM environment"
version = "0.5.2"

[dependencies]
futures = { workspace = true }
js-sys = "0.3.70"
lyxal_network-core = { workspace = true }
lyxal_network-identity = { workspace = true }
lyxal_network-noise = { workspace = true }
multiaddr = { workspace = true }
multihash = { workspace = true }
send_wrapper = { version = "0.6.0", features = ["futures"] }
thiserror = { workspace = true }
tracing = { workspace = true }
wasm-bindgen = "0.2.93"
wasm-bindgen-futures = "0.4.43"
web-sys = { version = "0.3.70", features = [
    "ReadableStreamDefaultReader",
    "WebTransport",
    "WebTransportBidirectionalStream",
    "WebTransportHash",
    "WebTransportOptions",
    "WebTransportReceiveStream",
    "WebTransportSendStream",
    "WritableStreamDefaultWriter",
] }

[dev-dependencies]
multibase = "0.9.1"

# Passing arguments to the docsrs builder in order to properly document cfg's.
# More information: https://docs.rs/about/builds#cross-compiling
[package.metadata.docs.rs]
all-features = true

[lints]
workspace = true
