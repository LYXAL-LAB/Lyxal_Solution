[package]
name = "lyxal_network-websocket"
edition.workspace = true
rust-version = { workspace = true }
description = "WebSocket transport for lyxal_network"
version = "0.45.2"

[dependencies]
futures-rustls = { workspace = true, features = ["ring"] }
either = "1.12.0"
futures = { workspace = true }
lyxal_network-core = { workspace = true }
lyxal_network-identity = { workspace = true }
parking_lot = "0.12.3"
pin-project-lite = "0.2.14"
rw-stream-sink = { workspace = true }
soketto = "0.8.0"
tracing = { workspace = true }
thiserror = { workspace = true }
url = "2.5"
webpki-roots = "0.26"

[dev-dependencies]
lyxal_network-tcp = { workspace = true, features = ["tokio"] }
lyxal_network-dns = { workspace = true, features = ["tokio"] }
lyxal_network-identity = { workspace = true, features = ["rand"] }
tokio = { workspace = true, features = ["rt", "macros", "io-std", "io-util"] }
rcgen = { workspace = true }

# Passing arguments to the docsrs builder in order to properly document cfg's.
# More information: https://docs.rs/about/builds#cross-compiling
[package.metadata.docs.rs]
all-features = true

[lints]
workspace = true
