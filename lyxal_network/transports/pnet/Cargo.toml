[package]
name = "lyxal_network-pnet"
edition.workspace = true
rust-version = { workspace = true }
description = "Private swarm support for lyxal_network"
version = "0.26.0"

[dependencies]
futures = { workspace = true }
salsa20 = "0.10"
sha3 = "0.10"
tracing = { workspace = true }
rand = "0.8"
pin-project = "1.1.5"

[dev-dependencies]
lyxal_network-core = { workspace = true }
lyxal_network-identity = { workspace = true, features = ["ed25519", "rsa", "ecdsa","secp256k1", "rand"] }
lyxal_network-noise = { workspace = true }
lyxal_network-swarm = { workspace = true, features = ["tokio"] }
lyxal_network-tcp = { workspace = true, features = ["tokio"] }
lyxal_network-websocket = { workspace = true }
lyxal_network-yamux = { workspace = true }
quickcheck = { workspace = true }
tokio = { workspace = true, features = ["full"] }

# Passing arguments to the docsrs builder in order to properly document cfg's.
# More information: https://docs.rs/about/builds#cross-compiling
[package.metadata.docs.rs]
all-features = true

[lints]
workspace = true
