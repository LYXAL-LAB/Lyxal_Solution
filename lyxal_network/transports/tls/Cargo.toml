[package]
name = "lyxal_network-tls"
version = "0.6.2"
edition.workspace = true
rust-version = { workspace = true }
description = "TLS configuration based on lyxal_network TLS specs."
exclude = ["src/test_assets"]

[dependencies]
futures = { workspace = true }
futures-rustls = { workspace = true }
lyxal_network-core = { workspace = true }
lyxal_network-identity = { workspace = true }
rcgen = { workspace = true }
ring = { workspace = true }
thiserror = { workspace = true }
webpki = { version = "0.103", package = "rustls-webpki", features = ["std"] }
x509-parser = "0.17.0"
yasna = "0.5.2"

# Exposed dependencies. Breaking changes to these are breaking changes to us.
[dependencies.rustls]
version = "0.23.9"
default-features = false
features = ["ring", "std"] # Must enable this to allow for custom verification code.


[dev-dependencies]
hex-literal = "0.4.1"
lyxal_network-core = { workspace = true }
lyxal_network-identity = { workspace = true, features = ["ed25519", "rsa", "secp256k1", "ecdsa", "rand"] }
lyxal_network-swarm = { workspace = true, features = ["tokio"] }
lyxal_network-yamux = { workspace = true }
tokio = { workspace = true, features = ["full"] }

# Passing arguments to the docsrs builder in order to properly document cfg's.
# More information: https://docs.rs/about/builds#cross-compiling
[package.metadata.docs.rs]
all-features = true

[lints]
workspace = true
