[package]
name = "lyxal_network-uds"
edition.workspace = true
rust-version = { workspace = true }
description = "Unix domain sockets transport for lyxal_network"
version = "0.43.1"

[dependencies]
lyxal_network-core = { workspace = true }
futures = { workspace = true }
tokio = { workspace = true, default-features = false, features = ["net"], optional = true }
tracing = { workspace = true }

[dev-dependencies]
tempfile = "3.10"
tokio = { workspace = true, features = ["rt", "macros", "io-util"] }

# Passing arguments to the docsrs builder in order to properly document cfg's.
# More information: https://docs.rs/about/builds#cross-compiling
[package.metadata.docs.rs]
all-features = true

[lints]
workspace = true
