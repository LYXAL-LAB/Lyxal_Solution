[package]
name = "lyxal_network-websocket-websys"
edition.workspace = true
rust-version.workspace = true
description = "WebSocket for lyxal_network under WASM environment"
version = "0.5.0"

[dependencies]
bytes = "1.6.0"
futures = { workspace = true }
js-sys = "0.3.69"
lyxal_network-core = { workspace = true }
tracing = { workspace = true }
send_wrapper = "0.6.0"
thiserror = { workspace = true }
wasm-bindgen = "0.2.90"
web-sys = { version = "0.3.69", features = ["BinaryType", "CloseEvent", "MessageEvent", "WebSocket", "Window", "WorkerGlobalScope"] }

# Passing arguments to the docsrs builder in order to properly document cfg's.
# More information: https://docs.rs/about/builds#cross-compiling
[package.metadata.docs.rs]
all-features = true

[dev-dependencies]
lyxal_network-yamux = { workspace = true }
lyxal_network-noise = { workspace = true }
lyxal_network-identity = { workspace = true, features = ["rand"] }
