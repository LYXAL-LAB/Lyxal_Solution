[package]
name = "lyxal_network-quic"
version = "0.13.0"
edition.workspace = true
rust-version = { workspace = true }
description = "TLS based QUIC transport implementation for lyxal_network"

[dependencies]
futures = { workspace = true }
futures-timer = "3.0.3"
if-watch = { workspace = true }
lyxal_network-core = { workspace = true }
lyxal_network-tls = { workspace = true }
lyxal_network-identity = { workspace = true }
quinn = { version = "0.11.6", default-features = false, features = ["rustls", "futures-io"] }
rand = "0.8.5"
rustls = { version = "0.23.9", default-features = false }
thiserror = { workspace = true }
tokio = { workspace = true, default-features = false, features = ["net", "rt", "time"], optional = true }
tracing = { workspace = true }
socket2 = "0.6.0"
ring = { workspace = true }

[features]
tokio = ["dep:tokio", "if-watch/tokio", "quinn/runtime-tokio"]

# Passing arguments to the docsrs builder in order to properly document cfg's.
# More information: https://docs.rs/about/builds#cross-compiling
[package.metadata.docs.rs]
all-features = true

[dev-dependencies]
lyxal_network-identity = { workspace = true, features = ["rand"] }
lyxal_network-muxer-test-harness = { path = "../../muxers/test-harness" }
lyxal_network-noise = { workspace = true }
lyxal_network-tcp = { workspace = true, features = ["tokio"] }
lyxal_network-yamux = { workspace = true }
quickcheck = "1"
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time"] }
tracing-subscriber = { workspace = true, features = ["env-filter"] }

[[test]]
name = "stream_compliance"
required-features = ["tokio"]

[lints]
workspace = true
