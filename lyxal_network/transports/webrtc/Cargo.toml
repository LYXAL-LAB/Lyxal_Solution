[package]
name = "lyxal_network-webrtc"
version = "0.9.0-alpha.2"
description = "WebRTC transport for lyxal_network"
edition.workspace = true
rust-version = { workspace = true }

[dependencies]
async-trait = "0.1"
futures = { workspace = true }
futures-timer = "3"
hex = "0.4"
if-watch = { workspace = true }
lyxal_network-core = { workspace = true }
lyxal_network-noise = { workspace = true }
lyxal_network-identity = { workspace = true }
lyxal_network-webrtc-utils = { workspace = true }
multihash = { workspace = true }
rand = "0.8"
rcgen = { workspace = true }
stun = "0.7"
thiserror = { workspace = true }
tokio = { workspace = true, features = ["net"], optional = true }
tokio-util = { version = "0.7", features = ["compat"], optional = true }
tracing = { workspace = true }
webrtc = { version = "0.12.0", optional = true }

[features]
tokio = ["dep:tokio", "dep:tokio-util", "dep:webrtc", "if-watch/tokio"]
pem = ["webrtc?/pem"]

[dev-dependencies]
lyxal_network-identity = { workspace = true, features = ["rand"] }
tokio = { workspace = true, features = ["full"] }
quickcheck = "1.0.3"
tracing-subscriber = { workspace = true, features = ["env-filter"] }


[[test]]
name = "smoke"
required-features = ["tokio"]

[lints]
workspace = true

# Passing arguments to the docsrs builder in order to properly document cfg's.
# More information: https://docs.rs/about/builds#cross-compiling
[package.metadata.docs.rs]
all-features = true
