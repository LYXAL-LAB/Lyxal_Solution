[package]
name = "webrtc-data"
version = "0.12.0"
edition = "2024"
description = "A pure Rust implementation of WebRTC DataChannel API"

[dependencies]
util = { version = "0.12.0", path = "../util", package = "webrtc-util", default-features = false, features = ["conn", "marshal"] }
sctp = { version = "0.13.0", path = "../sctp", package = "webrtc-sctp" }

tokio = { version = "1.32.0", features = [
    "fs",
    "io-util",
    "io-std",
    "macros",
    "net",
    "parking_lot",
    "rt",
    "rt-multi-thread",
    "sync",
    "time",
] }
bytes = "1"
log = "0.4"
thiserror = "1"
portable-atomic = "1.6"

[dev-dependencies]
env_logger = "0.11.3"
chrono = "0.4.28"
