[package]
name = "turn"
version = "0.11.0"
edition = "2024"
description = "A pure Rust implementation of TURN"

[dependencies]
util = { version = "0.12.0", path = "../util", package = "webrtc-util", default-features = false, features = ["conn", "vnet"] }
stun = { version = "0.9.0", path = "../stun" }

tokio = { version = "1.32.0", features = [
    "fs",
    "io-util",
    "io-std",
    "macros",
    "net",
    "parking_lot",
    "rt",
    "rt-multi-thread",
    "signal",
    "sync",
    "time",
] }
tokio-util = "0.7"
futures = "0.3"
async-trait = "0.1"
log = "0.4"
base64 = "0.22.1"
rand = "0.9"
ring = "0.17.14"
md-5 = "0.10"
thiserror = "1"
portable-atomic = "1.6"

[dev-dependencies]
env_logger = "0.11.3"
hex = "0.4"
clap = "3"
criterion = "0.5"

[features]
metrics = []

[[bench]]
name = "bench"
harness = false

[[example]]
name = "turn_client_udp"
path = "examples/turn_client_udp.rs"
bench = false

[[example]]
name = "turn_server_udp"
path = "examples/turn_server_udp.rs"
bench = false
