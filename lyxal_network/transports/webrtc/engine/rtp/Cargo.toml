[package]
name = "rtp"
version = "0.14.0"
edition = "2024"
description = "A pure Rust implementation of RTP"

[dependencies]
util = { version = "0.12.0", path = "../util", package = "webrtc-util", default-features = false, features = ["marshal"] }

bytes = "1"
rand = "0.9"
thiserror = "1"
serde = { version = "1", features = ["derive"] }
portable-atomic = "1.6"

memchr = "2.1.1"

[dev-dependencies]
chrono = "0.4.28"
criterion = "0.5"

[[bench]]
name = "packet_bench"
harness = false
