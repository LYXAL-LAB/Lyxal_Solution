[package]
name = "lyxal_network-tcp"
edition.workspace = true
rust-version = { workspace = true }
description = "TCP/IP transport protocol for lyxal_network"
version = "0.44.1"

[dependencies]
futures = { workspace = true }
futures-timer = "3.0"
if-watch = { workspace = true }
libc = "0.2.155"
lyxal_network-core = { workspace = true }
socket2 = { version = "0.6.0", features = ["all"] }
tokio = { workspace = true, default-features = false, features = ["net"], optional = true }
tracing = { workspace = true }

[features]
tokio = ["dep:tokio", "if-watch/tokio"]

[dev-dependencies]
tokio = { workspace = true, features = ["full"] }
tracing-subscriber = { workspace = true, features = ["env-filter"] }

# Passing arguments to the docsrs builder in order to properly document cfg's.
# More information: https://docs.rs/about/builds#cross-compiling
[package.metadata.docs.rs]
all-features = true


[lints]
workspace = true
