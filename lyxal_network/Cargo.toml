srtp = { version = "0.7.4", path = "transports/rtc/rtc-srtp", package = "rtc-srtp" }
stun = { version = "0.7.4", path = "transports/rtc/rtc-stun", package = "rtc-stun" }
turn = { version = "0.7.4", path = "transports/rtc/rtc-turn", package = "rtc-turn" }

# External dependencies
asynchronous-codec = { version = "0.7.0" }
env_logger = "0.11"
futures = "0.3.30"
futures-bounded = { version = "0.2.4" }
futures-rustls = { version = "0.26.0", default-features = false }
getrandom = "0.2"
if-watch = "3.2.1"
hickory-proto = { version = "0.25.2", default-features = false }
hickory-resolver = { version = "0.25.2", default-features = false }
multihash = "0.19.1"
multistream-select = { version = "0.13.0", path = "misc/multistream-select" }
prometheus-client = "0.24"
quick-protobuf-codec = { version = "0.3.1", path = "misc/quick-protobuf-codec" }
quickcheck = { package = "quickcheck-ext", path = "misc/quickcheck-ext" }
rcgen = "0.13"
ring = "0.17.12"
rw-stream-sink = { version = "0.4.0", path = "misc/rw-stream-sink" }
