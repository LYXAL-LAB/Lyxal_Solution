[package]
name = "lyxal_network-core"
edition.workspace = true
rust-version = { workspace = true }
version = "0.43.2"

[dependencies]
either = "1.11"
fnv = "1.0"
futures = { workspace = true, features = ["executor", "thread-pool"] }
futures-timer = "3"
web-time = { workspace = true }
lyxal_network-identity = { workspace = true, features = ["peerid", "ed25519"] }
multiaddr = { workspace = true }
multihash = { workspace = true }
multistream-select = { workspace = true }
parking_lot = "0.12.3"
pin-project = "1.1.5"
quick-protobuf = "0.8"
rand = "0.8"
rw-stream-sink = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
unsigned-varint = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["rt", "macros"] }
lyxal_network-mplex = { path = "../muxers/mplex" } # Using `path` here because this is a cyclic dev-dependency which otherwise breaks releasing.
lyxal_network-noise = { path = "../transports/noise" } # Using `path` here because this is a cyclic dev-dependency which otherwise breaks releasing.
multihash = { workspace = true, features = ["arb"] }
lyxal_network-identity = { workspace = true, features = ["ed25519", "rand"] }

[features]
serde = ["multihash/serde-codec", "lyxal_network-identity/serde"]

# Passing arguments to the docsrs builder in order to properly document cfg's.
# More information: https://docs.rs/about/builds#cross-compiling
[package.metadata.docs.rs]
all-features = true

[lints]
workspace = true
