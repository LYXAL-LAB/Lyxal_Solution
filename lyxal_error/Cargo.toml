[package]
name = "lyxal_error"
version = "0.1.0"
edition = "2021"
description = "Modèles d'erreurs métiers et contrats de résultats purs pour l'écosystème Lyxal OS"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
axum = { version = "0.7", optional = true }

[features]
default = []
axum = ["dep:axum"]
