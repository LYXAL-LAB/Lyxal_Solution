# Manifeste de l'hôte lyxal-groupware : il n'est pas un module du runtime (aucun LyxalModule) ;
# il déclare ses définitions d'erreurs GROUPWARE_*, installées avec lyxal_core et lyxal_error au
# démarrage (hors empreinte du socle). Aucun seed au lot 3 (aucun droit, aucune tâche).
manifest_version = 1
id = "lyxal_groupware"
name = "Lyxal Groupware"
version = "0.1.0"
description = "Hôte du courrier, des agendas et des contacts de Lyxal OS : définitions d'erreurs GROUPWARE_*"
capabilities = []

[runtime]
min_version = ">=0.1.0"

[[dependencies]]
id = "lyxal_error"
version = ">=0.1.0"

[resources]
error_definitions = ["error/groupware.surql"]
