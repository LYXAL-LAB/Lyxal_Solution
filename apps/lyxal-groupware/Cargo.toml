[package]
name = "lyxal-groupware"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
# Hôte du courrier, des agendas et des contacts : lie des crates AGPL (`lyxal_mail`) et porte du
# code de Stalwart (décision P2) ; seul binaire de Lyxal OS sous AGPL (décision P3).
license = "AGPL-3.0-only"
publish = false
description = "Hôte dédié du courrier, des agendas et des contacts de Lyxal OS (écoutes réseau supervisées)"

[lib]
name = "lyxal_groupware"
path = "src/lib.rs"

[[bin]]
name = "lyxal-groupware"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
async-trait.workspace = true
axum.workspace = true
config.workspace = true
serde.workspace = true
serde_json.workspace = true
surrealdb.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["net", "io-util"] }
tokio-util.workspace = true
tracing.workspace = true
lyxal_error.workspace = true
lyxal_crypto.workspace = true
lyxal_host = { workspace = true, features = ["host"] }
lyxal_mail.workspace = true
lyxal_runtime.workspace = true
lyxal_scheduler.workspace = true
lyxal_secrets.workspace = true
lyxal_storage.workspace = true
lyxal_surreal.workspace = true
# Options des sockets d'écoute (SO_REUSEADDR, SO_REUSEPORT, file d'attente, keepalive)
socket2 = { version = "0.6", features = ["all"] }
# Délai d'écriture d'une connexion (client qui ne lit plus), comme lyxal_host pour HTTP
tokio-io-timeout = "1.2"
# Poignée de main TLS côté serveur et STARTTLS (hôtes seulement, règle 10 du §11.3) : la
# configuration vient de lyxal_crypto::tls_server_config, fournisseur aws-lc-rs déjà choisi par
# lyxal_crypto, aucun fournisseur propre.
tokio-rustls = { version = "0.26.4", default-features = false, features = ["tls12", "aws_lc_rs"] }
# PROXY protocol v1 et v2 (décision G9), lu seulement depuis les réseaux déclarés.
proxy-header = { version = "0.1.3", features = ["tokio"] }

[build-dependencies]
lyxal_host = { workspace = true, features = ["build"] }

[dev-dependencies]
bytes = "1"
# Client SMTP réel des essais d'interopérabilité (MIT OR Apache-2.0, déjà dans l'arbre), en clair
# seulement : aucune fonctionnalité TLS (STARTTLS essayé par `openssl s_client`).
lettre = { version = "0.11.23", default-features = false, features = ["builder", "smtp-transport", "tokio1"] }
tempfile.workspace = true
# Client TLS d'essai : `openssl s_client` lancé par les essais (outil, pas une bibliothèque)
tokio = { workspace = true, features = ["process"] }
tower = { workspace = true, features = ["util"] }
tracing-subscriber.workspace = true
# Essais à deux hôtes (décision G16) : le vrai lyxal-server, dans ce sens seulement (code MIT
# dans un banc AGPL) ; lyxal-server ne dépend jamais de ce paquet.
lyxal-server = { path = "../lyxal-server" }
