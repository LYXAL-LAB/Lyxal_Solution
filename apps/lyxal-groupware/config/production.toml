# Production. Réception SMTP (port 25) écrite au lot 5 : écoute « smtp » ci-dessous, avec
# smtp.hostname (obligatoire) et la section [tls] pour STARTTLS. Les autres protocoles (soumission
# au lot 6, IMAP au lot 8…) ne répondent encore qu'un refus poli : leurs écoutes sont à
# décommenter avec leur lot.

[application]
name = "Lyxal Groupware"
environment = "production"

[http]
bind = "127.0.0.1:8090"
graceful_shutdown_seconds = 30

[database]
endpoint = "wss://db.interne:8000"
namespace = "lyxal"
database = "system"
connect_timeout_seconds = 15
# connections = 8            # connexions de la session système ; défaut : nombre de cœurs, 16 au plus

[observability]
log_filter = "info"
json_logs = true
include_target = false
include_thread_ids = false
log_client_ip = "network"

# Coffre-fort et stockage : sections communes aux hôtes (lyxal_host::services), mêmes valeurs que
# lyxal-server (clé maîtresse LYXAL_GROUPWARE__SECRETS__MASTER_KEY = celle de
# LYXAL__SECRETS__MASTER_KEY, par l'environnement seulement ; mêmes supports nommés). Sans eux,
# aucun message n'est déposé ni lu ; sans clé maîtresse alors qu'un bucket chiffré existe, l'hôte
# refuse de démarrer (GROUPWARE_MASTER_KEY_MISSING). lyxal-server doit tourner sur la même base.
# [secrets]
# master_key_id = "vault-2026"
#
# [storage.disk]
# root = "/srv/lyxal/fichiers"         # dossier partagé avec lyxal-server
#
# [mail]
# storage_backend = "default"

# Certificats (fichiers PEM, par exemple ceux de certbot ; clé en mode 0600 ou 0400, lisible par
# le seul compte du service), relus toutes les 60 s :
# [tls]
# default = { certificate = "/etc/lyxal/tls/mail.pem", private_key = "/etc/lyxal/tls/mail.key" }
# reload_interval_seconds = 60
# handshake_timeout_seconds = 30
#
# [[tls.certificates]]
# names = ["mail.exemple.fr", "imap.exemple.fr"]
# certificate = "/etc/letsencrypt/live/mail.exemple.fr/fullchain.pem"
# private_key = "/etc/letsencrypt/live/mail.exemple.fr/privkey.pem"

# Réception SMTP (lot 5) : nom de l'hôte (bannière, Received, Authentication-Results ; nom du MX
# et du DNS inverse de l'adresse publique), limites (valeurs par défaut du plan, décision S19),
# politique DMARC appliquée (dmarc_enforce = false : résultat seulement, pour la mise en service).
# Résolveur : celui du système par défaut ; un résolveur récursif local (Unbound) est recommandé.
# [smtp]
# hostname = "mx.exemple.fr"
# dmarc_enforce = true
# max_message_bytes = 52428800
# max_recipients = 100
#
# [dns]
# servers = ["127.0.0.1:53"]
# timeout_seconds = 5
# attempts = 2
#
# [[listeners]]
# id = "smtp"
# protocol = "smtp"
# bind = ["0.0.0.0:25", "[::]:25"]
# tls = "starttls"
#
# Soumission (lot 6) :
# [[listeners]]
# id = "submissions"
# protocol = "submission"
# bind = ["[::]:465"]
# tls = "implicit"
#
# IMAP (lot 8), derrière un répartiteur qui envoie l'en-tête PROXY :
# [[listeners]]
# id = "imaps"
# protocol = "imap"
# bind = ["[::]:993"]
# tls = "implicit"
# proxy_networks = ["10.0.0.0/8"]
