# Développement : écoutes sur 127.0.0.1, ports non privilégiés. Certificat de développement à
# fournir (fichiers relatifs au dossier de lancement ; clé en mode 0600), par exemple :
#   mkdir -p config/tls && openssl req -x509 -newkey ec -pkeyopt ec_paramgen_curve:P-256 -nodes \
#     -days 30 -subj "/CN=localhost" -addext "subjectAltName=DNS:localhost" \
#     -keyout config/tls/development.key.pem -out config/tls/development.chain.pem \
#     && chmod 600 config/tls/development.key.pem

# Fichiers en développement (section commune aux hôtes : même dossier dans lyxal-server) :
# [storage.disk]
# root = "../../target/lyxal-fichiers"

# Réception SMTP de développement (port 2525)
[smtp]
hostname = "localhost"

[tls]
default = { certificate = "config/tls/development.chain.pem", private_key = "config/tls/development.key.pem" }

[[listeners]]
id = "smtp"
protocol = "smtp"
bind = ["127.0.0.1:2525"]
tls = "starttls"

[[listeners]]
id = "submission"
protocol = "submission"
bind = ["127.0.0.1:2587"]
tls = "starttls"

[[listeners]]
id = "submissions"
protocol = "submission"
bind = ["127.0.0.1:2465"]
tls = "implicit"

[[listeners]]
id = "imap"
protocol = "imap"
bind = ["127.0.0.1:1143"]
tls = "starttls"

[[listeners]]
id = "imaps"
protocol = "imap"
bind = ["127.0.0.1:1993"]
tls = "implicit"

[[listeners]]
id = "pop3"
protocol = "pop3"
bind = ["127.0.0.1:1110"]
tls = "starttls"

[[listeners]]
id = "pop3s"
protocol = "pop3"
bind = ["127.0.0.1:1995"]
tls = "implicit"

[[listeners]]
id = "managesieve"
protocol = "managesieve"
bind = ["127.0.0.1:4190"]
tls = "starttls"
