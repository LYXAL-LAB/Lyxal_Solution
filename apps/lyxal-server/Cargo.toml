[package]
name = "lyxal-server"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false
description = "Binaire principal et orchestrateur de Lyxal OS"

[lib]
name = "lyxal_server"
path = "src/lib.rs"

[[bin]]
name = "lyxal-server"
path = "src/main.rs"

[features]
default = ["surreal-ws", "module-ingestion"]
surreal-ws = ["surrealdb/protocol-ws"]
surreal-http = ["surrealdb/protocol-http"]
module-ingestion = ["dep:lyxal_pipeline_ingestion"]

[dependencies]
anyhow.workspace = true
async-trait.workspace = true
axum.workspace = true
chrono.workspace = true
config.workspace = true
http.workspace = true
serde.workspace = true
serde_json.workspace = true
surrealdb.workspace = true
thiserror.workspace = true
tokio.workspace = true
tower.workspace = true
tower-http.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
uuid.workspace = true
lyxal_surreal.workspace = true
lyxal_error.workspace = true
lyxal_runtime.workspace = true
lyxal_event.workspace = true
lyxal_auth.workspace = true
lyxal_pipeline_ingestion = { workspace = true, optional = true }

[build-dependencies]
toml.workspace = true

[dev-dependencies]
tempfile.workspace = true
lyxal_crypto.workspace = true
tower = { workspace = true, features = ["util"] }
