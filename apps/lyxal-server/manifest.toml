# Manifeste de l'hôte : il n'est pas un module du runtime (aucun LyxalModule) ; il déclare ses
# définitions d'erreurs, installées avec lyxal_core et lyxal_error au démarrage, son droit
# d'administration de l'installation et les tâches de fond qu'il fait exécuter par
# lyxal_scheduler (seeds installés après les modules hébergés).
manifest_version = 1
id = "lyxal_server"
name = "Lyxal Server"
version = "0.1.0"
description = "Hôte de processus de Lyxal OS : définitions d'erreurs SERVER_*, droit d'administration de l'installation, tâches de fond confiées à lyxal_scheduler"
capabilities = []

[runtime]
min_version = ">=0.1.0"

[[dependencies]]
id = "lyxal_error"
version = ">=0.1.0"

[resources]
error_definitions = ["error/server.surql"]
seeds = ["seeds/server_permissions.surql", "seeds/server_tasks.surql"]
