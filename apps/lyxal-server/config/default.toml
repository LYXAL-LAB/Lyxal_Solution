[application]
name = "Lyxal OS"
environment = "development"
instance_id = "local"
version = "0.1.0"

[server]
host = "0.0.0.0"
port = 8080
request_timeout_seconds = 30
graceful_shutdown_seconds = 30
max_concurrency = 1024
body_limit_bytes = 10485760

[http]
transfer_idle_timeout_seconds = 60   # inactivité d'un transfert de fichier, écriture d'une connexion

[database]
endpoint = "ws://127.0.0.1:8000"
namespace = "lyxal"
database = "system"
connect_timeout_seconds = 15
# Connexions de la session système (pool) : par défaut le nombre de cœurs, 16 au plus ; 0 refusé.
# Sans effet sur une base embarquée (mem://). Un serveur SurrealDB ne répartit pas sur ses cœurs les
# requêtes d'une même connexion : le débit suit le nombre de connexions, jusqu'au nombre de cœurs de la base.
# connections = 8

[runtime]
module_install_timeout_seconds = 120
module_start_timeout_seconds = 30
module_stop_timeout_seconds = 20

[observability]
log_filter = "info,lyxal_server=debug"
json_logs = false
include_target = true
include_thread_ids = false

[cors]
enabled = true
allow_credentials = false
allowed_origins = ["http://localhost:3000", "http://localhost:5173"]
allowed_methods = ["GET", "HEAD", "POST", "PUT", "PATCH", "DELETE", "OPTIONS"]
allowed_headers = ["authorization", "content-type", "x-request-id"]

