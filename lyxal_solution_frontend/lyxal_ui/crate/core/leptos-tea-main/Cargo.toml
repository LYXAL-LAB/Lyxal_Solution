[workspace]
resolver = "2"
members = ["lib", "macros"]

[workspace.package]
version = "0.2.0"
edition = "2024"
rust-version = "1.88.0"
authors = ["J. Quesada"]
license = "MIT"
repository = "https://github.com/jquesada2016/leptos-tea"

[workspace.dependencies]
leptos = { path = "../leptos-main/leptos", version = "0.8.16" }
leptos_tea = { path = "lib" }
leptos_tea_macros = { path = "macros" }
syn = "2.0"
quote = "1.0"
proc-macro2 = "1.0"
proc-macro-error2 = "2.0"
futures = "0.3"
smallvec = "1.0"
