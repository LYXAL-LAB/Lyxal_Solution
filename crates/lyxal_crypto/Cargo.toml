[package]
name = "lyxal_crypto"
version.workspace = true
edition.workspace = true
rust-version = "1.85"
license.workspace = true
description = "Moteur de chiffrement AES-256-GCM, hachage, HMAC, HKDF, Argon2id et gestion des clés du Noyau Technique Lyxal OS"

[dependencies]
aes-gcm = { version = "=0.10.3", features = ["zeroize"] }
aes = { version = "=0.8.4", features = ["zeroize"] }
ghash = { version = "=0.5.1", features = ["zeroize"] }
polyval = { version = "=0.6.2", features = ["zeroize"] }
subtle = { version = "=2.6.1", default-features = false }
zeroize = { version = "1.8", features = ["zeroize_derive"] }
base64 = "0.22"
thiserror = { workspace = true }
rand_core = { version = "0.6", features = ["getrandom"] }
hex = "0.4"
sha2 = { workspace = true }
blake3 = "1.5"
argon2 = { version = "=0.5.3", features = ["std", "password-hash", "zeroize"] }
hmac = "0.12"
hkdf = "0.12"

[dev-dependencies]
tempfile = { workspace = true }
proptest = "1.5"
