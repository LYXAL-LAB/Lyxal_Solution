[package]
name = "lyxal_crypto"
version.workspace = true
edition.workspace = true
rust-version = "1.85"
license.workspace = true
description = "Moteur de chiffrement AES-256-GCM, chiffrement de fichiers en flux, TLS côté serveur et client, hachage, HMAC, HKDF, Argon2id, signatures RSA, Ed25519 et ES256, DKIM, chiffrement Web Push et gestion des clés du Noyau Technique Lyxal OS"

[dependencies]
aes-gcm = { version = "=0.10.3", features = ["zeroize"] }
aes = { version = "=0.8.4", features = ["zeroize"] }
ghash = { version = "=0.5.1", features = ["zeroize"] }
polyval = { version = "=0.6.2", features = ["zeroize"] }
subtle = { version = "=2.6.1", default-features = false }
zeroize = { version = "1.8", features = ["zeroize_derive"] }
base64 = "0.22"
thiserror = { workspace = true }
rand_core = { version = "0.6", features = ["getrandom"] }
hex = "0.4"
sha2 = { workspace = true }
blake3 = "1.5"
argon2 = { version = "=0.5.3", features = ["std", "password-hash", "zeroize"] }
hmac = "0.12"
# HMAC-SHA1 du TOTP seulement (RFC 6238, applications d'authentification), dans src/totp.rs.
sha1 = "0.10"
hkdf = "0.12"
# Seul moteur asymétrique du crate (décisions C1, C2 du lot 2 du programme courrier), déjà
# compilé dans chaque binaire du dépôt par surrealdb et rustls : signatures RSA (génération,
# RS256, rsa-sha256 de DKIM) et Ed25519 (src/signing.rs, src/dkim.rs) ; extension K8 :
# signatures ES256 et RS256 des jetons push, chiffrement Web Push RFC 8291 (src/webpush.rs),
# vérification HMAC-SHA1 des retours Twilio (src/hmac.rs). `ring` n'est plus une dépendance du
# crate ; la crate `rsa` n'est jamais utilisée (faille « Marvin »).
aws-lc-rs = { version = "1.19", default-features = false, features = ["aws-lc-sys", "alloc", "ring-io", "prebuilt-nasm"] }
# TLS côté serveur (lot 2 du programme courrier, P6 a ; décisions C1, C3, C7) : configuration
# rustls construite ici seulement, fournisseur aws-lc-rs passé explicitement (jamais
# `ServerConfig::builder()`, qui s'arrête par un panic! quand les deux fournisseurs de rustls
# sont actifs, cas du workspace). Déjà dans l'arbre par surrealdb, reqwest et lettre.
rustls = { version = "0.23.46", default-features = false, features = ["std", "tls12", "aws_lc_rs"] }
rustls-pki-types = { version = "1.15", features = ["std"] }
# Autorités du mode vérifié de tls_client_config (lot 6, décision E12, question Q1) : version
# figée, identique d'un nœud à l'autre (les racines du système ne sont jamais lues). Déjà dans
# l'arbre par lettre (lyxal_notification) ; licence CDLA-Permissive-2.0 admise dans deny.toml.
webpki-roots = "=1.0.11"

[dev-dependencies]
tempfile = { workspace = true }
proptest = "1.5"
# Lecture des vecteurs Wycheproof (tests/fixtures/wycheproof/) du chemin AES-256-GCM du flux.
serde_json = { workspace = true }
# Tests TLS seulement : le fournisseur `ring` de rustls est activé ici pour reproduire la
# configuration du workspace (deux fournisseurs actifs) dans le test de non-régression du
# panic! de `ServerConfig::builder()` ; tokio-rustls pour une poignée de main de bout en bout
# comme l'hôte la fera (TlsAcceptor), sans réseau (tokio::io::duplex).
rustls = { version = "0.23.46", default-features = false, features = ["std", "tls12", "aws_lc_rs", "ring"] }
tokio = { workspace = true, features = ["io-util"] }
tokio-rustls = { version = "0.26.4", default-features = false, features = ["tls12", "aws_lc_rs"] }
