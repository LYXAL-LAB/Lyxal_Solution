[package]
name = "lyxal_crypto"
version = "0.1.0"
edition = "2021"
description = "Moteur de chiffrement AES-256-GCM, hachage, HMAC, HKDF, Argon2id et gestion des clés du Noyau Technique Lyxal OS"

[dependencies]
aes-gcm = "0.10"
zeroize = { version = "1.8", features = ["zeroize_derive"] }
base64 = "0.22"
thiserror = "2.0"
rand_core = { version = "0.6", features = ["getrandom"] }
hex = "0.4"
sha2 = "0.10"
blake3 = "1.5"
argon2 = { version = "0.5", features = ["std", "password-hash"] }
hmac = "0.12"
hkdf = "0.12"

[dev-dependencies]
tempfile = "3.17"
proptest = "1.5"
