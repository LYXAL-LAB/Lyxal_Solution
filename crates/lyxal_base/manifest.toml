manifest_version = 1
id = "lyxal_base"
name = "Lyxal Base"
version = "0.1.0"
description = "Référentiels de base de Lyxal OS : types d'unités et unités de mesure"
capabilities = ["database"]

[runtime]
min_version = ">=0.1.0"

[[dependencies]]
id = "lyxal_core"
version = ">=0.1.0"

[[dependencies]]
id = "lyxal_error"
version = ">=0.1.0"

[[dependencies]]
id = "lyxal_i18n"
version = ">=0.1.0"

[resources]
schemas = [
    "schema/base_unite_type.surql",
    "schema/base_unite.surql",
    "schema/base_unite_code.surql"
]
functions = [
    "functions/libelle/base_libelle.surql",
    "functions/unite_type/unite_type_create.surql",
    "functions/unite_type/unite_type_get.surql",
    "functions/unite_type/unite_type_list.surql",
    "functions/unite_type/unite_type_update.surql",
    "functions/unite_type/unite_type_delete.surql",
    "functions/unite/unite_create.surql",
    "functions/unite/unite_get.surql",
    "functions/unite/unite_list.surql",
    "functions/unite/unite_update.surql",
    "functions/unite/unite_delete.surql",
    "functions/unite/unite_resolve.surql"
]
error_definitions = [
    "error/parametres/error_parametres.surql",
    "error/permissions/error_permissions.surql",
    "error/unite_type/error_unite_type.surql",
    "error/unite/error_unite.surql"
]
seeds = [
    "seeds/libelle_initial.surql",
    "seeds/unite_type_initial.surql",
    "seeds/unite_initial.surql",
    "seeds/unite_code_initial.surql"
]
