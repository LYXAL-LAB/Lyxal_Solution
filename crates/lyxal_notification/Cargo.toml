[package]
name = "lyxal_notification"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Notifications sortantes de Lyxal OS : parcours, gabarits, file d'envoi e-mail, journal et liste de suppression"

[dependencies]
lyxal_error = { workspace = true }
lyxal_surreal = { workspace = true }
lyxal_runtime = { workspace = true }
lyxal_event = { workspace = true }
lyxal_crypto = { workspace = true }
lyxal_i18n = { workspace = true }
async-trait = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
surrealdb = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }
fastrand = { workspace = true }
zeroize = "1.8"
minijinja = { version = "3.1", features = ["fuel"] }
# SMTP en TLS (rustls, fournisseur ring) ; DKIM laissé au relais (décision N4)
lettre = { version = "0.11.23", default-features = false, features = ["builder", "smtp-transport", "pool", "tokio1-rustls", "ring", "webpki-roots"] }

[dev-dependencies]
lyxal_auth = { workspace = true }
tokio = { workspace = true, features = ["net", "io-util"] }
base64 = "0.22"
