[package]
name = "lyxal_notification"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Notifications sortantes de Lyxal OS : abonnés, sujets, préférences, parcours à étapes (attente, regroupement, limitation, conditions), gabarits, intégrations (e-mail par SMTP, Brevo, Mailgun, Postmark, Resend ; SMS par Brevo, Twilio, Vonage ; messageries d'équipe ; appel signé d'une adresse web) et retours des fournisseurs, file d'envoi, diffusions, journal et liste de suppression"

[dependencies]
lyxal_error = { workspace = true }
lyxal_surreal = { workspace = true }
lyxal_runtime = { workspace = true }
lyxal_event = { workspace = true }
lyxal_crypto = { workspace = true }
lyxal_i18n = { workspace = true }
# Attentes, regroupements et purge (contrats publics : SchedulerClient, tâches déclarées par seed)
lyxal_scheduler = { workspace = true }
# Identifiants des intégrations (contrat public : SecretsClient, module annoncé comme consommateur)
lyxal_secrets = { workspace = true }
async-trait = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
surrealdb = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }
fastrand = { workspace = true }
zeroize = "1.8"
# Clé de signature des adresses web tirée du générateur du système (§11.3, règle 7)
rand_core = { version = "0.6", features = ["getrandom"] }
minijinja = { version = "3.1", features = ["fuel"] }
# Heures calmes dans le fuseau de l'abonné (comme lyxal_scheduler)
jiff = { version = "0.2", features = ["tzdb-bundle-always"] }
# Jetons de désabonnement (Base64url)
base64 = "0.22"
# Retours des fournisseurs de SMS en formulaire (Twilio, Vonage) ; déjà présent par reqwest
form_urlencoded = "1.2"
# SMTP en TLS (rustls, fournisseur ring) ; DKIM laissé au relais (décision N4)
lettre = { version = "0.11.23", default-features = false, features = ["builder", "smtp-transport", "pool", "tokio1-rustls", "ring", "webpki-roots"] }
# API HTTP des fournisseurs d'e-mail (K10) : rustls (fournisseur ring), sans native-tls ni OpenSSL
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }

[dev-dependencies]
lyxal_auth = { workspace = true }
tokio = { workspace = true, features = ["net", "io-util"] }
