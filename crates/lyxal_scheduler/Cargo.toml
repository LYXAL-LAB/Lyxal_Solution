[package]
name = "lyxal_scheduler"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Planificateur de Lyxal OS : calcul des dates (cron, intervalles, fuseaux, calendriers), appels typés des fonctions SurrealQL fn::scheduler_*, moteur (planificateur élu, exécuteurs par file, handlers)"

[dependencies]
lyxal_surreal = { workspace = true }
# Moteur : LyxalModule, LyxalWorker, ModuleHealthCheck, baux d'élection (W1)
lyxal_runtime = { workspace = true }
async-trait = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
surrealdb = { workspace = true }
thiserror = { workspace = true }
# Expressions cron de 5 à 7 champs (MIT), calcul dans un fuseau par jiff
croner = { version = "4", default-features = false, features = ["jiff"] }
# Fuseaux horaires : base du système, copie embarquée sinon (comme lyxal_i18n)
jiff = { version = "0.2", features = ["tzdb-bundle-always"] }
# Décalage aléatoire des échéances (U5), tiré par le générateur du système
rand_core = { version = "0.6", features = ["getrandom"] }
# Forme texte des identifiants d'exécution dans les adresses (base64url sans remplissage, X1)
base64 = "0.22"

[dev-dependencies]
# Journaux capturés dans les tests (aucun jeton de bail)
tracing-subscriber = { workspace = true }
