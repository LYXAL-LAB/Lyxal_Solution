[package]
name = "lyxal_surreal"
version = "0.1.0"
edition = "2021"
description = "Client générique et exécuteur de fonctions SurrealQL pour l'écosystème Lyxal OS"

[dependencies]
surrealdb = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
async-trait = { workspace = true }
thiserror = { workspace = true }
lyxal_error = { workspace = true }
axum = { workspace = true, optional = true }

[dev-dependencies]
tokio = { workspace = true }

[features]
default = []
axum = ["dep:axum", "lyxal_error/axum"]
