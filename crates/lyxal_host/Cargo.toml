[package]
name = "lyxal_host"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "MIT OR Apache-2.0"
description = "Code commun des hôtes de Lyxal OS : configuration, base, santé, journal, arrêt, HTTP, modules embarqués"

[features]
default = ["host"]
# Bibliothèque des hôtes (tout sauf l'aide de `build.rs`)
host = [
    "dep:async-trait",
    "dep:axum",
    "dep:chrono",
    "dep:config",
    "dep:hyper",
    "dep:hyper-util",
    "dep:lyxal_runtime",
    "dep:lyxal_surreal",
    "dep:serde",
    "dep:surrealdb",
    "dep:thiserror",
    "dep:tokio",
    "dep:tokio-io-timeout",
    "dep:tower",
    "dep:tracing",
    "dep:tracing-subscriber",
]
# Aide de `build.rs` des hôtes (modules embarqués) : n'amène que `toml`
build = ["dep:toml"]

[dependencies]
async-trait = { workspace = true, optional = true }
axum = { workspace = true, optional = true }
chrono = { workspace = true, optional = true }
config = { workspace = true, optional = true }
lyxal_runtime = { workspace = true, optional = true }
lyxal_surreal = { workspace = true, optional = true }
serde = { workspace = true, optional = true }
surrealdb = { workspace = true, optional = true }
thiserror = { workspace = true, optional = true }
tokio = { workspace = true, optional = true, features = ["net"] }
toml = { workspace = true, optional = true }
tower = { workspace = true, optional = true }
tracing = { workspace = true, optional = true }
tracing-subscriber = { workspace = true, optional = true }
# Service des connexions avec délai d'écriture (client qui ne lit plus)
hyper = { version = "1", optional = true, features = ["http1", "http2", "server"] }
hyper-util = { version = "0.1", optional = true, features = ["server-auto", "server-graceful", "tokio", "service"] }
tokio-io-timeout = { version = "1.2", optional = true }

[dev-dependencies]
bytes = "1"
futures = { version = "0.3", default-features = false, features = ["std"] }
tempfile.workspace = true
tokio = { workspace = true, features = ["net", "io-util"] }
