# Cibles de fuzzing de lyxal_mail_proto (cargo-fuzz) : mime_parse (lot 4), smtp_request et
# smtp_data (lot 5) ; lancées brièvement à leur création, longuement au lot 21 :
#   cargo +nightly-2026-10-20 fuzz run <cible>      (depuis crates/lyxal_mail_proto)
# Paquet hors du workspace (son propre `[workspace]`) : ni la CI ni `cargo build --workspace` ne
# le compilent.
[package]
name = "lyxal_mail_proto-fuzz"
version = "0.0.0"
edition = "2021"
license = "AGPL-3.0-only"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "=0.4.13"
lyxal_mail_proto = { path = ".." }

[[bin]]
name = "mime_parse"
path = "fuzz_targets/mime_parse.rs"
test = false
doc = false
bench = false

[[bin]]
name = "smtp_request"
path = "fuzz_targets/smtp_request.rs"
test = false
doc = false
bench = false

[[bin]]
name = "smtp_data"
path = "fuzz_targets/smtp_data.rs"
test = false
doc = false
bench = false

[workspace]
members = ["."]
resolver = "2"

