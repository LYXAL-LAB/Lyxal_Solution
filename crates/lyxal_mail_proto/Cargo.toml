[package]
name = "lyxal_mail_proto"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
# Crate du programme courrier (décision P2) : code écrit sur le modèle de Stalwart
# (AGPL-3.0-only OR LicenseRef-SEL, option AGPL retenue) et de Mox (MIT) ; voir SOURCES.md.
# Corpus de messages d'essai repris de mail-parser : MIT (avis dans LICENSES/MIT-mail-parser.txt).
license = "AGPL-3.0-only"
publish = false
description = "Syntaxes du courrier de Lyxal OS, sans base ni logique métier (lecture MIME, syntaxe SMTP)"

[dependencies]
# Lecture MIME (Apache-2.0 OR MIT). `full_encoding` : jeux de caractères hérités à plusieurs
# octets (Shift_JIS, GBK, Big5, EUC-KR...) par encoding_rs.
mail-parser = { version = "=1.0.1", default-features = false, features = ["full_encoding"] }
# Recherche d'octets (CR, LF, octet nul) dans la syntaxe SMTP (Unlicense OR MIT ; déjà dans
# l'arbre par mail-parser).
memchr = "2"
thiserror.workspace = true
time = { version = "0.3", default-features = false, features = ["std"] }
# Base64 de `AUTH PLAIN` / `AUTH LOGIN` et des parties d'avis (MIT OR Apache-2.0 ; déjà dans
# l'arbre par lyxal_mail et lyxal_crypto).
base64 = "0.22"
# Effacement des mots de passe lus par `AUTH` (Apache-2.0 OR MIT ; déjà dans l'arbre par
# lyxal_crypto). Ce n'est pas une primitive cryptographique.
zeroize = "1.8"

[dev-dependencies]
proptest = "1.5"
time = { version = "0.3", default-features = false, features = ["std", "macros"] }
