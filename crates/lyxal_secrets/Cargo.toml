[package]
name = "lyxal_secrets"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Coffre-fort des secrets applicatifs de Lyxal OS : valeurs scellées par lyxal_crypto, clés par organisation, lecture tracée, rescellement"

[dependencies]
lyxal_surreal = { workspace = true }
lyxal_runtime = { workspace = true }
lyxal_crypto = { workspace = true }
async-trait = { workspace = true }
surrealdb = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
# Noms des clés d'une valeur JSON (R4) : les valeurs ne sont jamais copiées (`IgnoredAny`)
serde = { workspace = true }
serde_json = { workspace = true }
# Tirage des clés d'organisation (même version que lyxal_crypto)
rand_core = { version = "0.6", features = ["getrandom"] }

