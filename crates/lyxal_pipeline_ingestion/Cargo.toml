[package]
name = "lyxal_pipeline_ingestion"
version = "0.1.0"
edition = "2021"
description = "Moteur industriel d'ingestion, normalisation, qualification et préparation des catalogues fabricants pour Lyxal OS"

[dependencies]
lyxal_error = { path = "../lyxal_error" }
lyxal_surreal = { path = "../lyxal_surreal" }
lyxal_runtime = { path = "../lyxal_runtime" }
lyxal_event = { path = "../lyxal_event" }
lyxal_crypto = { path = "../lyxal_crypto" }
lyxal_parsing = { workspace = true }
# Fichier source d'un lot : lu en flux dans le stockage
lyxal_storage = { workspace = true }
bytes = "1"
futures = { version = "0.3", default-features = false, features = ["std"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
async-trait = "0.1"
tokio = { version = "1.38", features = ["time", "sync", "macros", "rt", "rt-multi-thread"] }
surrealdb = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
lyxal_auth = { path = "../lyxal_auth" }
tempfile = "3.10"
# Octets d'un fichier source remplacés sur le support (test du fichier altéré)
object_store = { version = "0.13", default-features = false }
