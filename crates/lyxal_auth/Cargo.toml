[package]
name = "lyxal_auth"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Identités, organisations, rôles, permissions, invitations et contrôle des droits de Lyxal OS"

[dependencies]
lyxal_error = { workspace = true }
lyxal_surreal = { workspace = true }
lyxal_runtime = { workspace = true }
lyxal_crypto = { workspace = true }
async-trait = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
surrealdb = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tokio = { workspace = true }
uuid = { workspace = true }
base64 = "0.22"
rand_core = { version = "0.6", features = ["getrandom"] }
zeroize = "1.8"
# Résolveur DNS en Rust (vérification des domaines par enregistrement TXT)
hickory-resolver = { version = "0.25", default-features = false, features = ["tokio", "system-config"] }

[dev-dependencies]
async-trait = { workspace = true }
