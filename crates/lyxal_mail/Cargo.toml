[package]
name = "lyxal_mail"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
# Code porté de Stalwart (AGPL-3.0-only OR LicenseRef-SEL, option AGPL retenue) : décision P2.
# Les fichiers transposés de Mox gardent leur licence MIT (avis dans LICENSES/MIT-Mox.txt).
license = "AGPL-3.0-only"
publish = false
description = "Serveur de courrier de Lyxal OS : modèle de données SurrealQL, dépôt et lecture des messages chiffrés au repos, maintenance, contrat réseau des sessions, DNS et authenticité du courrier"

[dependencies]
# DKIM (octets signés, vérification) : toute la cryptographie passe par lyxal_crypto (règle 13
# du §11.3 ; mail-auth n'est jamais une dépendance, décision S1).
lyxal_crypto.workspace = true
lyxal_mail_proto.workspace = true
lyxal_runtime.workspace = true
# Clés DKIM et identifiants du relais sortant (lot 6) : coffre-fort de l'hôte
lyxal_secrets.workspace = true
lyxal_storage.workspace = true
lyxal_surreal.workspace = true
async-trait.workspace = true
surrealdb.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["io-util", "net"] }
tokio-util.workspace = true
tracing.workspace = true
# Identifiant `Message-ID` des messages déposés (UUID v7, plan du lot 6, §8.5).
uuid.workspace = true
bytes = "1"
futures = { version = "0.3", default-features = false, features = ["std"] }
# Valeurs `b=`, `bh=` et `p=` de DKIM en Base64 (MIT OR Apache-2.0, déjà dans l'arbre).
base64 = "0.22"
# Tirage du `pct=` de DMARC (RFC 7489 §6.6.4) : aucun usage cryptographique.
fastrand.workspace = true
# Résolveur DNS du courrier (décision S3) : sans DNSSEC (lot 7), sans DNS sur TLS ou HTTPS.
hickory-resolver = { version = "0.26", default-features = false, features = ["tokio", "system-config"] }
# Domaines Unicode convertis en forme ASCII (A-label) avant toute requête DNS (décision S16 ;
# MIT OR Apache-2.0, données Unicode-3.0, déjà dans l'arbre).
idna = "1.1"
# Liste des suffixes publics embarquée (décision S4) : domaine d'organisation de DMARC. Version
# figée (la liste est celle du jour de publication de la crate) ; mise à jour par plan (décision
# P14). Licence déclarée de la crate : MIT/Apache-2.0 ; données de la liste : MPL-2.0 (Mozilla).
psl = "=2.1.263"
# Jetons des adresses de retour (128 bits, règle 7 du §11.3 : OsRng seulement).
rand_core = { version = "0.6", features = ["getrandom"] }
# Identifiants du relais sortant rangés en JSON dans lyxal_secrets ({ username, password }).
serde.workspace = true
serde_json.workspace = true
# Mots de passe du relais sortant effacés de la mémoire (déjà dans l'arbre par lyxal_crypto).
zeroize = "1.8"
# Dates des avis de non-remise (lyxal_mail_proto::dsn ; MIT OR Apache-2.0, déjà dans l'arbre).
time = { version = "0.3", default-features = false, features = ["std"] }

[dev-dependencies]
proptest = "1.5"
# Dialogues SMTP des essais sur une vraie socket
tokio = { workspace = true, features = ["net", "io-util"] }
tempfile.workspace = true
tracing-subscriber.workspace = true
