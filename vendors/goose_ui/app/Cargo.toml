[package]
name = "app"
version = "0.1.0"
edition = "2024"
resolver = "2"

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "lyxal_web"
path = "src/main.rs"

[dependencies]
pulldown-cmark.workspace = true
syntect.workspace = true
reqwest = { workspace = true }
leptos_ui.workspace = true
icons.workspace = true
anyhow.workspace = true
console_error_panic_hook.workspace = true
console_log.workspace = true
dotenv.workspace = true
http.workspace = true
leptos.workspace = true
leptos_meta.workspace = true
leptos_router.workspace = true
log.workspace = true
tw_merge.workspace = true
strum.workspace = true
strum_macros.workspace = true
thiserror.workspace = true
web-sys = { workspace = true, features = ["ReadableStream", "ReadableStreamDefaultReader", "Headers", "Request", "Response", "RequestInit", "RequestMode", "Window", "HtmlTextAreaElement", "HtmlElement", "Element"] }
js-sys.workspace = true
wasm-bindgen = { workspace = true }
wasm-bindgen-futures = { workspace = true }
axum = { workspace = true, optional = true }
leptos_axum = { workspace = true, optional = true }
tokio = { workspace = true, optional = true }
tower = { workspace = true, optional = true }
tower-http = { workspace = true, optional = true }
validator.workspace = true
serde_json.workspace = true
time.workspace = true
serde.workspace = true

[features]
default = ["csr"]
csr = ["leptos/csr"]
hydrate = ["leptos/hydrate"]
ssr = [
"dep:axum",
"dep:leptos_axum",
"dep:tokio",
"dep:tower",
"dep:tower-http",
"leptos/ssr",
"leptos_meta/ssr",
"leptos_router/ssr",
]
